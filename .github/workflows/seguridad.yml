name: Ania Security Scan

on:
  schedule:
    # Se ejecuta todos los días a las 5am UTC
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar agente de seguridad
        run: node agente/seguridad.js

      - name: Commit y push del reporte
        run: |
          git config user.name "Ania Security Agent"
          git config user.email "security-agent@users.noreply.github.com"
          git add datos/security-report.json
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "Ania: reporte de seguridad automático $(date +%Y-%m-%d)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
