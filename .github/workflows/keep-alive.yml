name: Keep Ania Backend Awake

on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 minutos (Render duerme a los 15)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -sf --max-time 60 https://ania-oqct.onrender.com/ania/health \
            && echo "✔ Backend despierto" \
            || echo "⚠ Primer ping (cold start), reintentando..." \
            && sleep 5 && curl -sf --max-time 60 https://ania-oqct.onrender.com/ania/health
