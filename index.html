<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#00ff88">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>ANIA 3.0 — Tu Asistente Personal</title>
    <link rel="manifest" href='data:application/manifest+json,{"name":"ANIA 3.0","short_name":"Ania","start_url":".","display":"standalone","background_color":"%230a0a0f","theme_color":"%2300ff88","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 512 512%27%3E%3Crect width=%27512%27 height=%27512%27 rx=%27100%27 fill=%27%230a0a0f%27/%3E%3Ctext x=%27256%27 y=%27340%27 font-size=%27280%27 text-anchor=%27middle%27 fill=%27%2300ff88%27%3EΩ%3C/text%3E%3C/svg%3E","sizes":"512x512","type":"image/svg+xml"}]}'>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0a0f'/%3E%3Ctext x='50' y='70' font-family='Arial' font-size='70' font-weight='bold' fill='%2300ff88' text-anchor='middle'%3EΩ%3C/text%3E%3C/svg%3E">
    
    <style>
        :root {
            --bg: #0a0a0f; --bg-panel: #0f0f18; --bg-panel-light: #16162a;
            --neon: #00ff88; --neon-dim: rgba(0, 255, 136, 0.1);
            --neon-glow: 0 0 15px rgba(0, 255, 136, 0.4);
            --purple: #b44aff; --text: #e0e0e8; --dim: #8888a0;
            --danger: #ff4466; --font: 'Courier New', monospace;
            --radius: 12px; --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text);
            display: flex; flex-direction: column;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }
        #matrix-canvas { position: fixed; inset: 0; z-index: 0; opacity: 0.05; pointer-events: none; }

        /* --- Layout Principal --- */
        .app-container { display: flex; flex-direction: column; height: 100vh; position: relative; z-index: 5; }

        /* --- Header --- */
        .header {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 16px; background: rgba(15, 15, 24, 0.9);
            backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0, 255, 136, 0.1);
        }
        .avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--neon), #006633);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 900; color: var(--bg);
            box-shadow: var(--neon-glow); position: relative; flex-shrink: 0;
        }
        .avatar::after {
            content: ''; position: absolute; inset: -3px; border-radius: 50%;
            border: 2px solid transparent; border-top-color: var(--neon);
            animation: spin 3s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .header-info h1 {
            font-family: var(--font); font-size: 16px;
            letter-spacing: 2px; color: var(--neon); text-shadow: var(--neon-glow);
        }
        .header-info .status {
            font-size: 10px; color: var(--dim); font-family: var(--font);
            display: flex; align-items: center; gap: 6px;
        }
        .status-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--neon); box-shadow: 0 0 6px var(--neon);
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* --- Status Bar --- */
        .status-bar {
            display: flex; gap: 8px; padding: 8px 16px;
            background: var(--bg-panel); border-bottom: 1px solid rgba(0, 255, 136, 0.05);
            overflow-x: auto; scrollbar-width: none;
        }
        .status-bar::-webkit-scrollbar { display: none; }
        .chip {
            display: flex; align-items: center; gap: 6px;
            padding: 4px 12px; border-radius: 16px;
            background: var(--bg-panel-light); border: 1px solid rgba(0, 255, 136, 0.08);
            font-family: var(--font); font-size: 10px; white-space: nowrap;
            color: var(--dim); transition: var(--transition);
        }
        .chip.glow {
            border-color: var(--neon); color: var(--neon);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.1);
        }

        /* --- Chat --- */
        #chat {
            flex: 1; overflow-y: auto; padding: 16px;
            display: flex; flex-direction: column; gap: 12px;
            scroll-behavior: smooth;
        }
        #chat::-webkit-scrollbar { width: 4px; }
        #chat::-webkit-scrollbar-thumb { background: var(--neon); border-radius: 4px; }
        .msg {
            max-width: 85%; padding: 12px 16px; border-radius: var(--radius);
            font-size: 14px; line-height: 1.6; animation: msgIn 0.3s ease;
            word-wrap: break-word;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .msg.ania {
            align-self: flex-start;
            background: linear-gradient(135deg, var(--bg-panel-light), #1a1a30);
            border: 1px solid rgba(0, 255, 136, 0.1);
            border-bottom-left-radius: 4px;
        }
        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #003322, #004433);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-bottom-right-radius: 4px; color: #ccffdd;
        }
        .msg.system {
            align-self: center;
            background: rgba(180, 74, 255, 0.08);
            border: 1px solid rgba(180, 74, 255, 0.2);
            color: var(--purple); font-family: var(--font);
            font-size: 11px; padding: 6px 16px; border-radius: 20px;
        }
        .msg .timestamp {
            font-family: var(--font); font-size: 9px; color: var(--dim);
            margin-top: 6px; text-align: right; opacity: 0.5;
        }
        .msg strong { color: var(--neon); }
        .msg code {
            background: rgba(0, 255, 136, 0.1); padding: 2px 6px;
            border-radius: 4px; font-family: var(--font); font-size: 12px;
        }

        /* --- Input Area --- */
        .input-area {
            padding: 12px 16px 20px;
            background: linear-gradient(0deg, var(--bg-panel) 60%, transparent);
        }
        .input-row { display: flex; gap: 8px; align-items: flex-end; }
        .input-wrap { flex: 1; position: relative; display: flex; align-items: center; }
        #input {
            width: 100%; padding: 12px 48px 12px 16px;
            border-radius: 24px; border: 1px solid rgba(0, 255, 136, 0.15);
            background: var(--bg-panel-light); color: var(--text);
            font-size: 14px; font-family: inherit; outline: none;
            transition: var(--transition); resize: none;
            min-height: 48px; max-height: 120px;
        }
        #input:focus {
            border-color: var(--neon);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
        }
        #input::placeholder { color: #555570; font-style: italic; }
        .btn-icon {
            width: 48px; height: 48px; border-radius: 50%;
            border: none; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
            font-size: 20px; transition: var(--transition); flex-shrink: 0;
        }
        .btn-send {
            background: linear-gradient(135deg, var(--neon), #00aa55);
            color: var(--bg); box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }
        .btn-send:active { transform: scale(0.9); }
        .btn-mic {
            background: rgba(0, 255, 136, 0.06);
            border: 1px solid rgba(0, 255, 136, 0.15);
            color: var(--neon); position: absolute; right: 2px;
            width: 40px; height: 40px; font-size: 16px;
        }
        .btn-mic.on {
            background: var(--danger); border-color: var(--danger);
            color: white; animation: micPulse 1s infinite;
        }
        @keyframes micPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 68, 102, 0.5); }
            50% { box-shadow: 0 0 0 10px rgba(255, 68, 102, 0); }
        }

        /* --- Quick Actions --- */
        .quick-actions {
            display: flex; gap: 6px; padding: 0 16px 8px;
            overflow-x: auto; scrollbar-width: none;
        }
        .quick-actions::-webkit-scrollbar { display: none; }
        .qa-btn {
            padding: 8px 14px; border-radius: 18px;
            border: 1px solid rgba(0, 255, 136, 0.12);
            background: var(--bg-panel-light); color: var(--dim);
            font-size: 11px; font-family: var(--font); white-space: nowrap;
            cursor: pointer; transition: var(--transition);
        }
        .qa-btn:active {
            background: rgba(0, 255, 136, 0.15); color: var(--neon);
            border-color: var(--neon); transform: scale(0.95);
        }

        /* --- Modal Tareas --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px); z-index: 100;
            display: none; align-items: center; justify-content: center;
            padding: 20px; animation: fadeIn 0.3s ease;
        }
        .modal-overlay.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal {
            background: var(--bg-panel); border-radius: 16px;
            padding: 24px; max-width: 500px; width: 100%;
            max-height: 80vh; overflow-y: auto;
            border: 1px solid rgba(0, 255, 136, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 12px;
            border-bottom: 1px solid rgba(0, 255, 136, 0.1);
        }
        .modal-header h2 {
            font-family: var(--font); font-size: 16px;
            color: var(--neon); letter-spacing: 1px;
        }
        .modal-close {
            background: none; border: none; color: var(--dim);
            font-size: 24px; cursor: pointer; transition: var(--transition);
        }
        .modal-close:hover { color: var(--neon); }
        .task-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .task-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px; background: var(--bg-panel-light);
            border-radius: 10px; border: 1px solid rgba(0, 255, 136, 0.05);
            transition: var(--transition);
        }
        .task-item.done { opacity: 0.5; text-decoration: line-through; }
        .task-item .task-check {
            width: 20px; height: 20px; border-radius: 50%;
            border: 2px solid var(--neon); background: none;
            cursor: pointer; display: flex; align-items: center;
            justify-content: center; transition: var(--transition);
            flex-shrink: 0;
        }
        .task-item .task-check.done {
            background: var(--neon); color: var(--bg);
        }
        .task-item .task-text { flex: 1; font-size: 14px; }
        .task-item .task-time {
            font-family: var(--font); font-size: 10px; color: var(--dim);
        }
        .task-item .task-delete {
            background: none; border: none; color: var(--danger);
            cursor: pointer; font-size: 16px; opacity: 0.5;
            transition: var(--transition); padding: 4px;
        }
        .task-item .task-delete:hover { opacity: 1; }
        .empty-tasks {
            text-align: center; color: var(--dim);
            padding: 40px 20px; font-size: 14px;
        }

        /* --- Load Overlay --- */
        #load-overlay {
            position: fixed; inset: 0; z-index: 2000;
            background: rgba(10, 10, 15, 0.98);
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 20px; padding: 24px;
        }
        #load-overlay.on { display: flex; }
        .load-ring {
            width: 64px; height: 64px; border-radius: 50%;
            border: 3px solid rgba(0, 255, 136, 0.1);
            border-top-color: var(--neon);
            animation: spin 1s linear infinite;
        }
        .load-text {
            font-family: var(--font); font-size: 13px;
            color: var(--neon); text-align: center; letter-spacing: 1px;
        }
        .load-bar {
            width: 220px; height: 3px;
            background: rgba(0, 255, 136, 0.1); border-radius: 3px;
            overflow: hidden;
        }
        .load-bar-inner {
            height: 100%; background: linear-gradient(90deg, var(--neon), #00d4ff);
            border-radius: 3px; transition: width 0.5s; width: 0%;
        }

        /* --- Toast --- */
        .toast {
            position: fixed; top: 80px; left: 50%;
            transform: translateX(-50%) translateY(-16px);
            background: var(--bg-panel-light); border: 1px solid var(--neon);
            border-radius: 10px; padding: 12px 20px;
            font-size: 13px; color: var(--neon); z-index: 1000;
            opacity: 0; transition: var(--transition);
            pointer-events: none; box-shadow: var(--neon-glow);
            font-family: var(--font); max-width: 90vw; text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>

    <div class="app-container">
        <!-- HEADER -->
        <header class="header">
            <div class="avatar" id="avatar">Ω</div>
            <div class="header-info">
                <h1>ANIA 3.0</h1>
                <div class="status"><span class="status-dot"></span><span id="status-txt">INICIANDO...</span></div>
            </div>
        </header>

        <!-- STATUS BAR -->
        <div class="status-bar">
            <div class="chip" id="chip-hora">🕐 <span id="v-hora">--:--</span></div>
            <div class="chip" id="chip-temp">🌡️ <span id="v-temp">--°</span></div>
            <div class="chip" id="chip-loc">📍 <span id="v-loc">Localizando...</span></div>
            <div class="chip" id="chip-tasks">📋 <span id="v-tasks">0</span></div>
            <div class="chip" id="chip-sync">☁️ <span id="v-sync">—</span></div>
        </div>

        <!-- CHAT -->
        <main id="chat"></main>

        <!-- QUICK ACTIONS -->
        <div class="quick-actions">
            <button class="qa-btn" onclick="pedirPermisoNotificaciones()">🔔 Notificaciones</button>
            <button class="qa-btn" onclick="qa('hora')">🕐 Hora</button>
            <button class="qa-btn" onclick="qa('clima')">🌤️ Clima</button>
            <button class="qa-btn" onclick="qa('noticias')">📰 Noticias</button>
            <button class="qa-btn" onclick="qa('tareas')">📋 Tareas</button>
            <button class="qa-btn" onclick="qa('nueva')">➕ Nueva Tarea</button>
            <button class="qa-btn" onclick="qa('briefing')">☀️ Briefing</button>
            <button class="qa-btn" onclick="qa('festivos')">🎉 Festivos</button>
            <button class="qa-btn" onclick="qa('ayuda')">❓ Ayuda</button>
        </div>

        <!-- INPUT -->
        <div class="input-area">
            <div class="input-row">
                <div class="input-wrap">
                    <textarea id="input" placeholder="Habla con Ania..." rows="1"></textarea>
                    <button class="btn-icon btn-mic" id="mic-btn" onclick="toggleMic()">🎙️</button>
                </div>
                <button class="btn-icon btn-send" onclick="sendMsg()">➤</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE TAREAS -->
    <div class="modal-overlay" id="task-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>📋 MIS TAREAS</h2>
                <button class="modal-close" onclick="cerrarModalTareas()">&times;</button>
            </div>
            <ul class="task-list" id="modal-task-list"></ul>
        </div>
    </div>

    <!-- LOAD OVERLAY -->
    <div id="load-overlay">
        <div class="load-ring"></div>
        <div class="load-text" id="load-text">Inicializando núcleo de IA...</div>
        <div class="load-bar"><div class="load-bar-inner" id="load-progress"></div></div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script>
        /* ==========================================================
           ANIA 3.0 — Asistente Personal Unificada
           Arquitectura: Motor de Reglas + Sincronización Backend
           ========================================================== */

        // ====== CONFIGURACIÓN GLOBAL ======
        const CONFIG = {
            BACKEND_URL: 'https://meditech-bot.onrender.com/api',
            ANIA_USER: 'admin',
            WEATHER_API: 'https://api.open-meteo.com/v1',
            GEO_API: 'https://nominatim.openstreetmap.org/reverse',
            HOLIDAYS_API: 'https://date.nager.at/api/v3/NextPublicHolidays',
            NEWS_PROXY: 'https://api.allorigins.win/raw?url=',
            SYNC_INTERVAL: 30000, // 30 segundos
            TASK_CHECK_INTERVAL: 15000 // 15 segundos
        };

        // ====== ESTADO GLOBAL ======
        const S = {
            tasks: [],
            location: null,
            weather: null,
            airQuality: null,
            holidays: [],
            listening: false,
            recognition: null,
            synth: speechSynthesis,
            voices: [],
            femaleVoice: null,
            userName: '',
            history: [],
            conversationMemory: [],
            lastBriefing: null,
            isOnline: false
        };

        // ====== MÓDULO DE PERSISTENCIA ======
        const DB = {
            get(key, fallback) {
                try { return JSON.parse(localStorage.getItem('ania_' + key)) ?? fallback; }
                catch { return fallback; }
            },
            set(key, val) {
                try { localStorage.setItem('ania_' + key, JSON.stringify(val)); }
                catch(e) { console.warn('Storage full', e); }
            }
        };

        // ====== MÓDULO DE SINCRONIZACIÓN ======
        const Sync = {
            online: false,
            lastSync: null,
            checking: false,

            async check() {
                if (this.checking) return this.online;
                this.checking = true;
                try {
                    const ctrl = new AbortController();
                    const t = setTimeout(() => ctrl.abort(), 8000);
                    const r = await fetch(`${CONFIG.BACKEND_URL}/health`, { signal: ctrl.signal });
                    clearTimeout(t);
                    this.online = r.ok;
                } catch { this.online = false; }
                finally { this.checking = false; }
                this.updateChip();
                return this.online;
            },

            updateChip() {
                const el = document.getElementById('v-sync');
                const chip = document.getElementById('chip-sync');
                if (!el) return;
                if (this.online) {
                    el.textContent = this.lastSync
                        ? this.lastSync.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })
                        : 'Online';
                    chip.classList.add('glow');
                } else {
                    el.textContent = 'Offline';
                    chip.classList.remove('glow');
                }
            },

            async pushTask(task) {
                if (!this.online) { this.queuePush(task); return false; }
                try {
                    const r = await fetch(`${CONFIG.BACKEND_URL}/ania/tasks`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            texto: task.text,
                            remindAt: task.remindAt,
                            usuario: CONFIG.ANIA_USER,
                            source: 'web'
                        })
                    });
                    if (!r.ok) throw new Error('Push failed');
                    const serverTask = await r.json();
                    task.serverId = serverTask.id;
                    DB.set('tasks', S.tasks);
                    return true;
                } catch (e) {
                    console.warn('Push falló, encolando:', e.message);
                    this.queuePush(task);
                    return false;
                }
            },

            async pullTasks() {
                if (!this.online) return null;
                try {
                    const r = await fetch(`${CONFIG.BACKEND_URL}/ania/tasks?user=${CONFIG.ANIA_USER}`);
                    if (!r.ok) return null;
                    const remote = await r.json();
                    if (!Array.isArray(remote)) return null;

                    const localIds = new Set(S.tasks.flatMap(t => [t.id, t.serverId].filter(Boolean)));
                    const nuevas = remote.filter(t => !localIds.has(t.id));

                    for (const r of nuevas) {
                        S.tasks.push({
                            id: r.id,
                            serverId: r.id,
                            text: r.texto,
                            remindAt: r.remindAt,
                            done: r.done,
                            created: r.created,
                            source: r.source || 'telegram'
                        });
                    }

                    for (const local of S.tasks) {
                        if (!local.serverId) continue;
                        const remoto = remote.find(r => r.id === local.serverId);
                        if (remoto && remoto.done !== local.done) {
                            local.done = remoto.done;
                        }
                    }

                    DB.set('tasks', S.tasks);
                    updateTaskChip();
                    if (nuevas.length > 0) {
                        addMsg('system', `🔄 Sincronizadas ${nuevas.length} tarea(s) nuevas.`);
                    }
                    this.lastSync = new Date();
                    this.updateChip();
                    return nuevas;
                } catch (e) {
                    console.warn('Pull falló:', e.message);
                    return null;
                }
            },

            queuePush(task) {
                const q = DB.get('push_queue', []);
                q.push({ text: task.text, remindAt: task.remindAt, created: task.created });
                DB.set('push_queue', q);
            },

            async flushQueue() {
                const q = DB.get('push_queue', []);
                if (!q.length || !this.online) return;
                const remaining = [];
                for (const t of q) {
                    try {
                        const r = await fetch(`${CONFIG.BACKEND_URL}/ania/tasks`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ ...t, usuario: CONFIG.ANIA_USER, source: 'web' })
                        });
                        if (!r.ok) remaining.push(t);
                    } catch { remaining.push(t); }
                }
                DB.set('push_queue', remaining);
            },

            async markDone(task) {
                if (!this.online || !task.serverId) return;
                try {
                    await fetch(`${CONFIG.BACKEND_URL}/ania/tasks/${task.serverId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ done: true })
                    });
                } catch (e) { console.warn('markDone failed:', e.message); }
            }
        };

        // ====== INICIALIZACIÓN ======
        document.addEventListener('DOMContentLoaded', async () => {
            initMatrix();
            initVoices();
            initRecognition();
            loadPersisted();
            updateClock();
            setInterval(updateClock, 1000);
            setInterval(checkTasks, CONFIG.TASK_CHECK_INTERVAL);
            setInterval(proactiveCheck, 60000);
            autoLocate();
            updateNotifButton();

            S.tasks = DB.get('tasks', []);
            S.userName = DB.get('userName', '');
            updateTaskChip();

            const inp = document.getElementById('input');
            inp.addEventListener('input', () => {
                inp.style.height = 'auto';
                inp.style.height = Math.min(inp.scrollHeight, 120) + 'px';
            });
            inp.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
            });

            registerSW();

        // ====== FONDO MATRIX ======
        function initMatrix() {
            const c = document.getElementById('matrix-canvas');
            const ctx = c.getContext('2d');
            let w, h, cols, drops;
            function resize() {
                w = c.width = innerWidth; h = c.height = innerHeight;
                cols = Math.floor(w / 14); drops = Array(cols).fill(1);
            }
            resize(); addEventListener('resize', resize);
            const chars = 'アイウエオカキクケコサシスセソタチツテト0123456789ABCDEFΩ∆∇≡⟨⟩';
            setInterval(() => {
                ctx.fillStyle = 'rgba(10,10,15,.05)';
                ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = '#00ff88';
                ctx.font = '12px monospace';
                for (let i = 0; i < drops.length; i++) {
                    ctx.fillText(chars[Math.random() * chars.length | 0], i * 14, drops[i] * 14);
                    if (drops[i] * 14 > h && Math.random() > .975) drops[i] = 0;
                    drops[i]++;
                }
            }, 60);
        }

        // ====== PARSEO DE FECHA NATURAL ======
        function nextWeekday(desde, diaTarget) {
            const d = new Date(desde);
            const diff = (diaTarget + 7 - d.getDay()) % 7 || 7;
            d.setDate(d.getDate() + diff);
            return d;
        }

        function parsearFechaNatural(texto) {
            const ahora = new Date();
            const t = texto.toLowerCase();
            let fecha = new Date(ahora);
            let tieneFecha = false;

            if (/\bpasado mañana\b/.test(t)) { fecha.setDate(fecha.getDate() + 2); tieneFecha = true; }
            else if (/\bmañana\b/.test(t)) { fecha.setDate(fecha.getDate() + 1); tieneFecha = true; }
            else if (/\bhoy\b/.test(t)) { tieneFecha = true; }
            else if (/\blunes\b/.test(t)) { fecha = nextWeekday(fecha, 1); tieneFecha = true; }
            else if (/\bmartes\b/.test(t)) { fecha = nextWeekday(fecha, 2); tieneFecha = true; }
            else if (/\bmiércoles|miercoles\b/.test(t)) { fecha = nextWeekday(fecha, 3); tieneFecha = true; }
            else if (/\bjueves\b/.test(t)) { fecha = nextWeekday(fecha, 4); tieneFecha = true; }
            else if (/\bviernes\b/.test(t)) { fecha = nextWeekday(fecha, 5); tieneFecha = true; }
            else if (/\bsábado|sabado\b/.test(t)) { fecha = nextWeekday(fecha, 6); tieneFecha = true; }
            else if (/\bdomingo\b/.test(t)) { fecha = nextWeekday(fecha, 0); tieneFecha = true; }

            const horaM = t.match(/a\s+las?\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i);
            if (horaM) {
                let hh = parseInt(horaM[1]);
                const mm = parseInt(horaM[2] || '0');
                const pm = horaM[3] === 'pm';
                const am = horaM[3] === 'am';
                if (pm && hh < 12) hh += 12;
                if (am && hh === 12) hh = 0;
                fecha.setHours(hh, mm, 0, 0);
                tieneFecha = true;
                if (!/\b(hoy|mañana|pasado mañana|lunes|martes|miércoles|jueves|viernes|sábado|domingo)\b/.test(t) && fecha < ahora) {
                    fecha.setDate(fecha.getDate() + 1);
                }
            }
            return tieneFecha ? fecha : null;
        }

        // ====== GESTIÓN DE TAREAS ======
        function addTask(text, remindAt) {
            const t = {
                id: Date.now(),
                text,
                remindAt: remindAt instanceof Date ? remindAt.toISOString() : remindAt,
                done: false,
                created: new Date().toISOString(),
                source: 'web'
            };
            S.tasks.push(t);
            DB.set('tasks', S.tasks);
            updateTaskChip();
            if (t.remindAt) scheduleReminder(t);
            Sync.pushTask(t).catch(() => {});
            return t;
        }

        function scheduleReminder(task) {
            const delay = new Date(task.remindAt) - Date.now();
            if (delay <= 0 || delay > 2147483647) return;
            setTimeout(() => fireReminder(task), delay);
        }

        function fireReminder(task) {
            if (task.done) return;
            if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
                try { new Notification('🔔 ANIA — Recordatorio', { body: task.text, tag: 'ania-' + task.id }); } catch {}
            }
            addMsg('ania', `⏰ **Recordatorio:** ${task.text}`);
            speak(`Recordatorio: ${task.text}`);
        }

        function checkTasks() {
            const now = Date.now();
            let cambios = false;
            S.tasks.forEach(t => {
                if (!t.done && t.remindAt && new Date(t.remindAt).getTime() <= now && !t.notified) {
                    t.notified = true;
                    cambios = true;
                    fireReminder(t);
                }
            });
            if (cambios) DB.set('tasks', S.tasks);
        }

        // ====== SERVICE WORKER ======
        function registerSW() {
            if (!('serviceWorker' in navigator)) return;
            const swCode = `
                const CACHE = 'ania-v3';
                self.addEventListener('install', e => {
                    e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./'])));
                    self.skipWaiting();
                });
                self.addEventListener('activate', e => e.waitUntil(clients.claim()));
                self.addEventListener('fetch', e => {
                    e.respondWith(
                        caches.match(e.request).then(r => r || fetch(e.request).then(res => {
                            if (res.ok && e.request.method === 'GET') {
                                const clone = res.clone();
                                caches.open(CACHE).then(c => c.put(e.request, clone));
                            }
                            return res;
                        })).catch(() => caches.match('./'))
                    );
                });
            `;
            navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], { type: 'application/javascript' }))).catch(() => {});
        }

        // ====== MOTOR DE REGLAS AVANZADO ======
        function ruleEngine(text) {
            const t = text.toLowerCase().trim();

            // --- Recordatorios ---
            const remindMatch = text.match(/(?:recuérdame|recordar|avísame|no me olvides(?: de)?|apunta(?: que)?|anota(?: que)?)\s+(.+)/i);
            if (remindMatch) {
                const tareaTexto = remindMatch[1].trim();
                const fecha = parsearFechaNatural(tareaTexto);
                let textoSinFecha = tareaTexto;
                if (fecha) {
                    textoSinFecha = tareaTexto
                        .replace(/\b(mañana|hoy|pasado mañana|lunes|martes|miércoles|miercoles|jueves|viernes|sábado|sabado|domingo)\b/gi, '')
                        .replace(/a\s+las?\s+\d{1,2}(:\d{2})?\s*(am|pm)?/gi, '')
                        .replace(/\s+/g, ' ').trim();
                    if (!textoSinFecha) textoSinFecha = tareaTexto;
                }
                addTask(textoSinFecha, fecha);
                let r = `✅ Recordatorio programado: "${textoSinFecha}".`;
                if (fecha) {
                    r += ` Te avisaré el ${fecha.toLocaleDateString('es-ES', { day: 'numeric', month: 'long' })} a las ${fecha.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}.`;
                }
                return r;
            }

            // --- Saludos ---
            if (/^(hola|hey|buenas|qué tal|saludos|buenos días|buenas tardes|buenas noches)/.test(t)) {
                const h = new Date().getHours();
                const g = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
                return `${g}${S.userName ? ', ' + S.userName : ''}. ¿En qué puedo servirle?`;
            }

            // --- Nombre ---
            const nameM = text.match(/(?:me llamo|mi nombre es|soy)\s+(\w+)/i);
            if (nameM) {
                S.userName = nameM[1];
                DB.set('userName', S.userName);
                return `Encantada, ${S.userName}. Lo recordaré. ¿Algo más?`;
            }
            if (/cómo me llamo|cuál es mi nombre/.test(t)) return S.userName ? `Se llama ${S.userName}.` : 'Aún no me ha dicho su nombre.';

            // --- Hora ---
            if (/hora|qué hora/.test(t)) {
                return `Son las ${new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}.`;
            }

            // --- Fecha ---
            if (/fecha|qué día|día es/.test(t)) {
                return `Hoy es ${new Date().toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}.`;
            }

            // --- Clima ---
            if (/clima|tiempo|temperatura|llueve|frío|calor/.test(t)) {
                if (!S.weather) return 'Aún no tengo datos del clima. Verifique el permiso de ubicación.';
                const w = S.weather.current;
                const city = S.location?.city || 'su zona';
                let r = `En ${city}: ${weatherDesc(w.weather_code)}, ${Math.round(w.temperature_2m)}°C (sensación ${Math.round(w.apparent_temperature)}°C). Humedad ${w.relative_humidity_2m}%, viento ${w.wind_speed_10m} km/h.`;
                if (S.airQuality) {
                    const aqi = S.airQuality.european_aqi;
                    const calidad = aqi <= 20 ? 'excelente' : aqi <= 40 ? 'buena' : aqi <= 60 ? 'moderada' : 'mala';
                    r += ` Calidad del aire: ${calidad} (AQI ${aqi}).`;
                }
                return r;
            }

            // --- Ubicación ---
            if (/dónde estoy|mi ubicación|dónde me encuentro/.test(t)) {
                if (!S.location) return 'No tengo acceso a su ubicación.';
                return `Se encuentra en ${S.location.city || 'su zona'}${S.location.country ? ', ' + S.location.country : ''} (${S.location.lat.toFixed(4)}, ${S.location.lon.toFixed(4)}).`;
            }

            // --- Tareas: listar (abre modal) ---
            if (/mis tareas|qué tareas|pendientes|lista/.test(t)) {
                abrirModalTareas();
                return `He abierto tu lista de tareas. Tienes ${S.tasks.filter(x => !x.done).length} pendientes.`;
            }

            // --- Tareas: crear (formato explícito) ---
            const taskM = t.match(/(?:crea|añade|agrega|nueva|tengo que)\s+(?:una?\s+)?(?:tarea|recordatorio|nota)?:?\s*(.+)/i);
            if (taskM) {
                let taskText = taskM[1].trim();
                const fecha = parsearFechaNatural(taskText);
                if (fecha) {
                    taskText = taskText.replace(/\b(mañana|hoy|pasado mañana|lunes|martes|miércoles|jueves|viernes|sábado|domingo)\b/gi, '')
                                     .replace(/a\s+las?\s+\d{1,2}(:\d{2})?\s*(am|pm)?/gi, '').trim();
                }
                addTask(taskText || taskM[1], fecha);
                let r = `✅ Tarea guardada: "${taskText || taskM[1]}".`;
                if (fecha) r += ` Programada para ${fecha.toLocaleDateString('es-ES')} a las ${fecha.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}.`;
                return r;
            }

            // --- Tareas: completar (por número) ---
            const doneM = t.match(/(?:completar|terminar|hecho|listo|elimina|borra)\s+(?:tarea\s+)?(\d+)/i);
            if (doneM) {
                const idx = parseInt(doneM[1]) - 1;
                const p = S.tasks.filter(x => !x.done);
                if (idx >= 0 && idx < p.length) {
                    p[idx].done = true;
                    DB.set('tasks', S.tasks);
                    updateTaskChip();
                    Sync.markDone(p[idx]);
                    renderModalTareas();
                    return `✅ "${p[idx].text}" completada. ¡Bien hecho!`;
                }
                return 'No encontré esa tarea. Diga "mis tareas" para ver la lista.';
            }

            // --- Noticias ---
            if (/noticias|novedades|qué pasa|actualidad/.test(t)) return { action: 'news' };

            // --- Festivos ---
            if (/festivo|feriado|día libre|próximo festivo/.test(t)) {
                if (!S.holidays.length) return 'No tengo datos de festivos para su país.';
                const next = S.holidays[0];
                return `El próximo festivo es el ${new Date(next.date).toLocaleDateString('es-ES', { day: 'numeric', month: 'long' })}: ${next.localName || next.name}.`;
            }

            // --- Briefing ---
            if (/briefing|resumen|qué tengo hoy|resumen del día/.test(t)) return { action: 'briefing' };

            // --- Ayuda ---
            if (/ayuda|qué puedes hacer|tus funciones|comandos/.test(t)) {
                return `**Mis capacidades:**\n\n🕐 Hora y fecha\n🌤️ Clima + calidad del aire\n📍 Ubicación GPS\n📋 Tareas y recordatorios (sincronizadas con Telegram)\n📰 Noticias\n🎉 Festivos\n☀️ Briefing matutino\n🎙️ Voz (hablar y escuchar)\n\n**Ejemplos:**\n"recuérdame comprar leche mañana a las 10"\n"avísame de llamar a Juan el lunes a las 3 pm"\n"mis tareas"`;
            }

            if (/gracias|te agradezco/.test(t)) return '¡De nada! Para eso estoy. ¿Algo más?';
            if (/adiós|chao|hasta luego|nos vemos/.test(t)) return 'Hasta luego. Aquí estaré cuando me necesite.';
            if (/cómo estás|qué tal estás/.test(t)) return 'Funcionando al 100%. Todos los sistemas operativos. ¿Y usted?';

            return null; // Si no coincide, se usa el fallback final
        }

        // ====== GENERAR BRIEFING ======
        async function generateBriefing() {
            const parts = [];
            const h = new Date().getHours();
            const greet = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
            parts.push(`${greet}${S.userName ? ', ' + S.userName : ''}. Aquí tiene su briefing:`);
            parts.push(`📅 ${new Date().toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}`);

            if (S.weather) {
                const w = S.weather.current;
                const d = S.weather.daily;
                parts.push(`🌤️ **Clima:** ${weatherDesc(w.weather_code)}, ${Math.round(w.temperature_2m)}°C. Máx ${Math.round(d.temperature_2m_max[0])}° / Mín ${Math.round(d.temperature_2m_min[0])}°. UV: ${d.uv_index_max[0]}.`);
            }

            const pending = S.tasks.filter(t => !t.done);
            if (pending.length) {
                parts.push(`📋 **${pending.length} tarea${pending.length > 1 ? 's' : ''} pendiente${pending.length > 1 ? 's' : ''}:**`);
                pending.slice(0, 5).forEach((t, i) => {
                    let line = `  ${i + 1}. ${t.text}`;
                    if (t.remindAt) line += ` — ⏰ ${new Date(t.remindAt).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}`;
                    parts.push(line);
                });
            } else {
                parts.push('📋 Sin tareas pendientes.');
            }

            const today = new Date().toISOString().slice(0, 10);
            const holidayToday = S.holidays.find(x => x.date === today);
            if (holidayToday) parts.push(`🎉 **Hoy es festivo:** ${holidayToday.localName || holidayToday.name}`);

            try {
                const news = await fetchNews();
                if (news.length) {
                    parts.push('📰 **Titulares:**');
                    news.slice(0, 3).forEach(n => parts.push(`  • ${n.title}`));
                }
            } catch {}

            S.lastBriefing = new Date().toISOString();
            DB.set('lastBriefing', S.lastBriefing);
            return parts.join('\n');
        }

        // ====== NOTICIAS (con proxy CORS) ======
        async function fetchNews(query) {
            const q = query || 'noticias españa';
            const googleUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(q)}&hl=es&gl=ES&ceid=ES:es`;
            const proxiedUrl = `${CONFIG.NEWS_PROXY}${encodeURIComponent(googleUrl)}`;
            try {
                const r = await fetch(proxiedUrl);
                if (!r.ok) throw new Error('Proxy HTTP ' + r.status);
                const xml = await r.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(xml, 'text/xml');
                const items = [...doc.querySelectorAll('item')].slice(0, 5);
                return items.map(it => ({
                    title: it.querySelector('title')?.textContent || '',
                    link: it.querySelector('link')?.textContent || '',
                    source: it.querySelector('source')?.textContent || '',
                    date: it.querySelector('pubDate')?.textContent || ''
                }));
            } catch (e) {
                console.warn('fetchNews error:', e.message);
                return [];
            }
        }

        // ====== PROACTIVIDAD ======
        function proactiveCheck() {
            const now = new Date();
            const h = now.getHours();
            if (h >= 7 && h <= 9) {
                const today = now.toISOString().slice(0, 10);
                const lastB = S.lastBriefing ? S.lastBriefing.slice(0, 10) : '';
                if (lastB !== today && S.location && S.weather) {
                    generateBriefing().then(b => {
                        addMsg('ania', b);
                        speak('Buenos días. Aquí tiene su briefing matutino.');
                    });
                }
            }
            const pending = S.tasks.filter(t => !t.done);
            if (pending.length >= 3 && h >= 10 && h <= 20 && Math.random() < 0.05) {
                addMsg('system', `💡 Tienes ${pending.length} tareas pendientes. Di "mis tareas" para revisarlas.`);
            }
        }

        // ====== ENVIAR MENSAJE ======
        async function sendMsg() {
            const inp = document.getElementById('input');
            const text = inp.value.trim();
            if (!text) return;
            inp.value = '';
            inp.style.height = 'auto';

            addMsg('user', text);
            setStatus('PROCESANDO...');
            document.getElementById('avatar').classList.add('thinking');

            const typing = document.createElement('div');
            typing.className = 'typing';
            typing.innerHTML = '<span></span><span></span><span></span>';
            document.getElementById('chat').appendChild(typing);
            scrollBottom();

            const ruleResult = ruleEngine(text);

            if (ruleResult && typeof ruleResult === 'object' && ruleResult.action) {
                typing.remove();
                if (ruleResult.action === 'news') {
                    const news = await fetchNews(text.replace(/noticias|novedades|qué pasa|actualidad/gi, '').trim());
                    if (news.length) {
                        let r = '📰 **Últimas noticias:**\n';
                        news.forEach((n, i) => { r += `${i + 1}. ${n.title} (${n.source})\n`; });
                        addMsg('ania', r);
                        speak('Aquí tiene las últimas noticias.');
                    } else {
                        addMsg('ania', 'No pude obtener noticias en este momento.');
                    }
                } else if (ruleResult.action === 'briefing') {
                    const b = await generateBriefing();
                    addMsg('ania', b);
                    speak('Aquí tiene su briefing.');
                }
                setStatus('SISTEMA ACTIVO');
                document.getElementById('avatar').classList.remove('thinking');
                return;
            }

            if (ruleResult) {
                typing.remove();
                addMsg('ania', ruleResult);
                if (ruleResult.length < 350) speak(ruleResult);
                setStatus('SISTEMA ACTIVO');
                document.getElementById('avatar').classList.remove('thinking');
                return;
            }

            typing.remove();
            const fallback = `No estoy segura de cómo responder a eso. ` +
                `Puedo ayudarte con: hora, clima, ubicación, tareas, noticias, festivos o un briefing. ` +
                `También puedes usar "recuérdame ..." para crear recordatorios.`;
            addMsg('ania', fallback);
            speak(fallback);
            setStatus('SISTEMA ACTIVO');
            document.getElementById('avatar').classList.remove('thinking');
        }

        // ====== UI HELPERS ======
        function addMsg(role, text) {
            const c = document.getElementById('chat');
            const m = document.createElement('div');
            m.className = `msg ${role}`;
            const formatted = String(text)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/`(.+?)`/g, '<code>$1</code>')
                .replace(/\n/g, '<br>');
            m.innerHTML = formatted + `<div class="timestamp">${new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}</div>`;
            c.appendChild(m);
            scrollBottom();
            S.history.push({ role, text, time: new Date().toISOString() });
            DB.set('history', S.history.slice(-100));
        }

        function scrollBottom() {
            const c = document.getElementById('chat');
            requestAnimationFrame(() => { c.scrollTop = c.scrollHeight; });
        }

        function qa(action) {
            const map = {
                hora: '¿Qué hora es?',
                clima: '¿Cómo está el clima?',
                noticias: 'Dame las últimas noticias',
                tareas: 'mis tareas',
                nueva: 'Recuérdame ',
                briefing: 'Dame mi briefing del día',
                festivos: '¿Cuál es el próximo festivo?',
                ayuda: 'Ayuda'
            };
            const t = map[action] || action;
            document.getElementById('input').value = t;
            if (action === 'nueva') { document.getElementById('input').focus(); return; }
            sendMsg();
        }

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        function loadPersisted() {
            S.history = DB.get('history', []);
            S.conversationMemory = DB.get('memory', []);
            S.lastBriefing = DB.get('lastBriefing', null);
        }

        // Exponer funciones globalmente
        window.pedirPermisoNotificaciones = pedirPermisoNotificaciones;
        window.toggleMic = toggleMic;
        window.sendMsg = sendMsg;
        window.qa = qa;
        window.abrirModalTareas = abrirModalTareas;
        window.cerrarModalTareas = cerrarModalTareas;
        window.completarTarea = completarTarea;
        window.eliminarTarea = eliminarTarea;
    </script>
</body>
