<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ANIA-OS · Núcleo Personal</title>
<style>
/* ============================================================
   ANIA-OS · Estilos unificados
   - Shell del OS (Kalm-OS-7)
   - Panel flotante de Ania
   ============================================================ */
:root{
  --accent:#0a84d8; --accent2:#0067b0;
  --tbh:44px;
  --win-bg:#fff; --chrome:#f0f0f0; --chrome2:#e6e6e6;
  --text:#1b1b1b; --text2:#6b6b6b; --border:#d8d8d8;
  --hover:rgba(0,0,0,.06); --menu-bg:rgba(26,30,36,.98);
  --ania-acc:#2de08a; --ania-acc2:#39ff9b; --ania-danger:#ff5470; --ania-amber:#ffb547;
}
body.dark{
  --win-bg:#242424; --chrome:#2e2e2e; --chrome2:#3a3a3a;
  --text:#f1f1f1; --text2:#a9a9a9; --border:#464646;
  --hover:rgba(255,255,255,.08); --menu-bg:rgba(18,20,24,.98);
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;}
html,body{height:100%;overflow:hidden;font-family:"Segoe UI","Open Sans",Arial,sans-serif;}
body{background:#000;color:var(--text);}
input,textarea,[contenteditable]{user-select:text;-webkit-user-select:text;}
button{font-family:inherit;}
::-webkit-scrollbar{width:11px;height:11px;}
::-webkit-scrollbar-thumb{background:#8a8a8a;border:3px solid transparent;background-clip:content-box;border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* ===== Desktop ===== */
#desktop{position:fixed;inset:0;display:none;}
#desktop.on{display:block;}
#wallpaper{position:absolute;inset:0;background-size:cover;background-position:center;}
#win-layer{position:absolute;inset:0 0 var(--tbh) 0;}
#dicons{
  position:absolute;top:12px;left:12px;bottom:calc(var(--tbh) + 12px);
  display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;
  gap:6px;z-index:1;
}
.dicon{
  width:88px;padding:8px 4px;border:1px solid transparent;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:default;border-radius:2px;
}
.dicon:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);}
.dicon.sel{background:rgba(10,132,216,.35);border-color:rgba(140,200,255,.6);}
.dicon .di-ic{height:44px;display:grid;place-items:center;}
.dicon span{
  color:#fff;font-size:12px;text-align:center;
  text-shadow:0 1px 3px rgba(0,0,0,.9);line-height:1.25;
  max-height:32px;overflow:hidden;word-break:break-word;
}

/* ===== Taskbar ===== */
#taskbar{
  position:absolute;left:0;right:0;bottom:0;height:var(--tbh);
  background:rgba(12,16,22,.93);display:flex;align-items:stretch;
  z-index:450;color:#fff;
}
.tb-item{border:0;background:none;color:#fff;display:grid;place-items:center;cursor:pointer;}
#tb-start{
  width:56px;
  background:radial-gradient(circle at 50% 30%,#3d9ae8,#0a4d8c 78%);
  border-right:1px solid rgba(255,255,255,.12);
}
#tb-start:hover{filter:brightness(1.18);}
.orb{
  width:27px;height:27px;border-radius:50%;
  display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;
  text-shadow:0 1px 2px rgba(0,30,60,.9);
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.9),rgba(255,255,255,0) 55%);
}
#tb-search{
  display:flex;align-items:center;gap:8px;width:200px;
  margin:6px 4px;background:rgba(255,255,255,.13);padding:0 10px;
  border:1px solid rgba(255,255,255,.12);
}
#tb-search input{flex:1;background:none;border:0;outline:0;color:#fff;font-size:13px;}
#tb-search input::placeholder{color:rgba(255,255,255,.75);}
#tb-tasks{flex:1;display:flex;align-items:stretch;overflow:hidden;padding-left:6px;}
.task-btn{
  width:46px;border:0;background:none;color:#fff;position:relative;
  display:grid;place-items:center;cursor:pointer;
}
.task-btn:hover{background:rgba(255,255,255,.12);}
.task-btn .tline{position:absolute;bottom:0;left:8px;right:8px;height:2px;background:rgba(255,255,255,.45);}
.task-btn.active{background:rgba(255,255,255,.18);}
.task-btn.active .tline{height:3px;left:4px;right:4px;background:var(--accent);}
#tray{display:flex;align-items:stretch;}
.tray-icons{display:flex;align-items:center;gap:12px;padding:0 10px;font-size:14px;cursor:default;}
#tb-clock{
  display:flex;flex-direction:column;justify-content:center;align-items:flex-end;
  padding:0 12px;font-size:12px;line-height:1.35;cursor:default;
}
#tb-clock:hover,.tray-icons:hover{background:rgba(255,255,255,.1);}

/* ===== Start menu ===== */
#start-menu{
  position:absolute;left:0;bottom:var(--tbh);width:640px;max-width:96vw;
  background:var(--menu-bg);color:#fff;display:none;flex-direction:column;
  z-index:480;box-shadow:0 -4px 30px rgba(0,0,0,.5);
}
#start-menu.on{display:flex;animation:smIn .18s ease-out;}
@keyframes smIn{from{transform:scale(.96) translateY(8px);opacity:0;}}
.sm-row{display:flex;flex:1;min-height:440px;max-height:min(560px,72vh);}
.sm-rail{
  width:52px;display:flex;flex-direction:column;align-items:center;
  padding:10px 0;gap:4px;
}
.sm-rail button{
  width:42px;height:42px;border:0;background:none;color:#e8e8e8;
  font-size:16px;border-radius:2px;cursor:pointer;display:grid;place-items:center;
}
.sm-rail button:hover{background:rgba(255,255,255,.12);}
.sm-user{
  width:44px;height:44px;border-radius:50%;background:#274b70;
  display:grid;place-items:center;font-size:18px;margin:6px 0;
}
.sm-apps{width:238px;overflow-y:auto;padding:10px 4px 14px 10px;}
.sm-apps button{
  display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;
  background:none;border:0;color:#eee;font-size:13px;cursor:pointer;
  border-radius:2px;text-align:left;
}
.sm-apps button:hover{background:rgba(255,255,255,.12);}
.sm-tiles{flex:1;overflow-y:auto;padding:16px 14px;}
.tile-group{margin-bottom:20px;}
.tile-group h4{font-size:12px;font-weight:600;color:#ddd;margin:0 4px 8px;}
.tiles{display:grid;grid-template-columns:repeat(4,72px);grid-auto-rows:72px;gap:5px;}
.tile{
  border:0;color:#fff;cursor:pointer;
  display:flex;flex-direction:column;justify-content:space-between;
  align-items:flex-start;padding:8px;font-size:11px;text-align:left;
}
.tile:hover{filter:brightness(1.12);outline:2px solid rgba(255,255,255,.55);outline-offset:-2px;}
.tile:active{transform:scale(.96);}
.tile .ti{font-size:20px;height:26px;display:grid;place-items:center;}
.tile.w2{grid-column:span 2;}

/* ===== Windows ===== */
.window{
  position:absolute;display:flex;flex-direction:column;
  background:var(--win-bg);color:var(--text);
  box-shadow:0 12px 38px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.2);
  animation:winIn .16s ease-out;
}
@keyframes winIn{from{transform:scale(.95);opacity:0;}}
.window.closing{transform:scale(.95);opacity:0;transition:.14s;}
.window.maximized{left:0!important;top:0!important;width:100vw!important;height:calc(100vh - var(--tbh))!important;}
.window.minimized{
  transform:scale(.86) translateY(50px);opacity:0;visibility:hidden;
  pointer-events:none;transition:transform .18s,opacity .18s,visibility 0s .18s;
}
.titlebar{
  height:34px;flex:0 0 auto;display:flex;align-items:center;
  background:var(--chrome);border-bottom:1px solid var(--border);
}
.window:not(.active) .titlebar{opacity:.75;}
.tb-ico{width:34px;display:grid;place-items:center;flex:0 0 auto;}
.tb-title{
  flex:1;font-size:12.5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;padding-right:8px;
}
.tb-btns{display:flex;height:100%;}
.tb-btn{
  width:46px;border:0;background:none;color:var(--text);
  display:grid;place-items:center;cursor:pointer;
}
.tb-btn:hover{background:var(--hover);}
.tb-btn.close:hover{background:#e81123;color:#fff;}
.win-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative;}
.rz{position:absolute;right:0;bottom:0;width:17px;height:17px;cursor:nwse-resize;z-index:5;}

/* ===== Apps internas ===== */
.ex-toolbar{display:flex;align-items:center;gap:4px;padding:6px 8px;background:var(--chrome);border-bottom:1px solid var(--border);flex-wrap:wrap;}
.ex-nav{width:32px;height:30px;border:0;background:none;color:var(--text);cursor:pointer;border-radius:2px;}
.ex-nav:hover{background:var(--hover);}
.ex-crumb{flex:1;display:flex;align-items:center;gap:2px;background:var(--win-bg);border:1px solid var(--border);height:30px;padding:0 10px;font-size:12.5px;overflow:hidden;white-space:nowrap;min-width:120px;}
.ex-btn{height:30px;border:1px solid var(--border);background:var(--win-bg);color:var(--text);padding:0 12px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:7px;}
.ex-btn:hover{background:var(--hover);}
.ex-main{flex:1;display:flex;min-height:0;}
.ex-side{width:178px;flex:0 0 auto;border-right:1px solid var(--border);overflow-y:auto;padding:8px 4px;background:var(--chrome);}
.ex-side button{display:flex;align-items:center;gap:11px;width:100%;padding:7px 10px;border:0;background:none;color:var(--text);font-size:12.5px;cursor:pointer;border-radius:2px;text-align:left;}
.ex-side button:hover{background:var(--hover);}
.ex-side button.on{background:rgba(10,132,216,.14);}
.ex-grid{flex:1;overflow-y:auto;padding:12px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;}
.ex-item{width:104px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;border:1px solid transparent;cursor:default;border-radius:2px;}
.ex-item:hover{background:var(--hover);}
.ex-item.sel{background:rgba(10,132,216,.15);border-color:rgba(10,132,216,.4);}
.ex-item .ic{height:46px;display:grid;place-items:center;}
.ex-item span{font-size:12px;text-align:center;line-height:1.25;max-height:30px;overflow:hidden;word-break:break-word;}
.ex-status{height:26px;flex:0 0 auto;border-top:1px solid var(--border);display:flex;align-items:center;padding:0 12px;font-size:11.5px;color:var(--text2);gap:18px;}

.np-area{flex:1;border:0;outline:0;resize:none;padding:10px 14px;font-family:Consolas,"Courier New",monospace;font-size:14px;line-height:1.55;background:var(--win-bg);color:var(--text);}
.np-status{height:24px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;gap:18px;padding:0 14px;font-size:11.5px;color:var(--text2);}

.calc{flex:1;display:flex;flex-direction:column;background:var(--win-bg);padding:10px 12px 14px;}
.calc .disp{text-align:right;font-size:40px;font-weight:300;padding:2px 4px 12px;min-height:64px;overflow:hidden;white-space:nowrap;}
.calc .grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
.calc .grid button{border:1px solid var(--border);background:var(--chrome);color:var(--text);font-size:16px;cursor:pointer;}
.calc .grid button.op{background:var(--chrome2);}
.calc .grid button.eq{background:var(--accent);color:#fff;border-color:var(--accent);}

.term{flex:1;display:flex;flex-direction:column;background:#0c0c0c;color:#cfcfcf;font-family:Consolas,monospace;font-size:13.5px;padding:8px 10px;}
.term-out{flex:1;overflow-y:auto;white-space:pre-wrap;word-break:break-word;}
.term-line{display:flex;gap:6px;padding-top:4px;}
.term-ps{white-space:pre;}
.term-in{flex:1;background:none;border:0;outline:0;color:#cfcfcf;font:inherit;}

.page{width:794px;min-height:1000px;background:#fff;color:#111;box-shadow:0 3px 16px rgba(0,0,0,.4);padding:70px 76px;outline:0;font-size:15px;line-height:1.65;overflow-wrap:break-word;}
.wp-canvas{flex:1;overflow-y:auto;background:#565d66;padding:26px 0;display:flex;justify-content:center;align-items:flex-start;}
.wp-toolbar{display:flex;align-items:center;gap:3px;padding:6px 8px;background:var(--chrome);border-bottom:1px solid var(--border);flex-wrap:wrap;}
.wp-btn{width:30px;height:28px;border:1px solid transparent;background:none;color:var(--text);cursor:pointer;border-radius:2px;display:grid;place-items:center;font-size:13px;}
.wp-btn:hover{background:var(--hover);}

.pt-canvas-wrap{flex:1;overflow:auto;background:#3d434c;display:grid;place-items:center;padding:14px;}
.pt-canvas-wrap canvas{background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.4);cursor:crosshair;touch-action:none;}

.wx{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px;}
.wx-search{display:flex;gap:8px;}
.wx-search input{flex:1;padding:8px 10px;border:1px solid var(--border);background:var(--win-bg);color:var(--text);outline:0;}

/* ===== Boot / lock ===== */
#boot{position:fixed;inset:0;background:#000;z-index:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;}
#boot .bname{color:#dcdcdc;font-weight:300;font-size:22px;letter-spacing:.22em;}
.spinner{position:relative;width:42px;height:42px;}
.spinner i{position:absolute;inset:0;animation:orb 2.1s cubic-bezier(.45,.1,.55,.9) infinite;}
.spinner i::after{content:"";position:absolute;left:50%;top:0;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#fff;}
.spinner i:nth-child(2){animation-delay:.12s;}.spinner i:nth-child(3){animation-delay:.24s;}
.spinner i:nth-child(4){animation-delay:.36s;}.spinner i:nth-child(5){animation-delay:.48s;}
@keyframes orb{0%{transform:rotate(0);}100%{transform:rotate(360deg);}}

#lock{position:fixed;inset:0;z-index:500;display:none;background-size:cover;background-position:center;}
#lock.on{display:block;}
#lock::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.28);}
.lock-clock{position:absolute;left:56px;top:22vh;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.5);}
.lock-clock .lt{font-size:88px;font-weight:300;line-height:1;}
.lock-clock .ld{font-size:26px;font-weight:300;margin-top:6px;}
.lock-brand{position:absolute;right:26px;bottom:20px;color:rgba(255,255,255,.75);font-size:13px;letter-spacing:.18em;}
.lock-hint{position:absolute;left:0;right:0;bottom:9vh;text-align:center;color:#fff;font-weight:300;font-size:16px;animation:pulse 2.4s infinite;}
@keyframes pulse{0%,100%{opacity:.95;}50%{opacity:.45;}}
#login{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(15,35,60,.45);}
#login.on{display:flex;}
.avatar{width:132px;height:132px;border-radius:50%;background:#274b70;color:#fff;display:grid;place-items:center;font-size:56px;font-weight:300;box-shadow:0 6px 30px rgba(0,0,0,.4);}
#login .uname{color:#fff;font-size:26px;font-weight:300;}
.btn-accent{background:var(--accent);color:#fff;border:0;padding:9px 42px;font-size:15px;cursor:pointer;}
.btn-accent:hover{filter:brightness(1.12);}
.lock-power{position:absolute;right:34px;bottom:56px;color:#fff;background:none;border:0;font-size:20px;cursor:pointer;opacity:.85;}
.lock-power:hover{opacity:1;}
#shutdown{position:fixed;inset:0;background:#000;z-index:700;display:none;flex-direction:column;align-items:center;justify-content:center;gap:28px;color:#cfcfcf;font-weight:300;}
#shutdown.on{display:flex;}
#power-on{width:84px;height:84px;border-radius:50%;border:2px solid #444;background:#0c0c0c;color:#8b8b8b;font-size:30px;cursor:pointer;}
#power-on:hover{border-color:var(--accent);color:var(--accent);}

/* ===== Panel flotante de Ania ===== */
#ania-fab{
  position:fixed;right:22px;bottom:70px;z-index:9998;
  width:62px;height:62px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #39ff9b, #0a7a4a 60%, #052918 100%);
  box-shadow:0 8px 28px rgba(45,224,138,.55), 0 0 0 2px rgba(45,224,138,.25),
             inset 0 0 20px rgba(255,255,255,.18);
  cursor:pointer;display:grid;place-items:center;
  transition:transform .3s cubic-bezier(.2,.9,.3,1), box-shadow .3s;
  user-select:none;
}
#ania-fab:hover{transform:scale(1.08);}
#ania-fab:active{transform:scale(.94);}
#ania-fab.escuchando{animation:aniaPulse 1.2s ease-in-out infinite;}
#ania-fab.pensando{background:radial-gradient(circle at 35% 30%, #ffb547, #a06d00 60%, #291a00 100%);}
#ania-fab svg{width:32px;height:32px;fill:#04080a;}
@keyframes aniaPulse{
  0%,100%{box-shadow:0 0 0 4px rgba(57,255,155,.4), 0 0 30px rgba(57,255,155,.7);}
  50%    {box-shadow:0 0 0 14px rgba(57,255,155,.05), 0 0 50px rgba(57,255,155,1);}
}

#ania-panel{
  position:fixed;right:22px;bottom:146px;z-index:9999;
  width:min(400px, calc(100vw - 32px));height:min(580px, calc(100vh - 200px));
  background:linear-gradient(180deg, rgba(8,18,14,.98), rgba(2,6,4,.99));
  border:1px solid rgba(45,224,138,.35);border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.7), 0 0 40px rgba(45,224,138,.15);
  display:none;flex-direction:column;overflow:hidden;
  color:#cfeede;backdrop-filter:blur(14px);
  font-family:"Segoe UI",Arial,sans-serif;
}
#ania-panel.abierto{display:flex;animation:aniaSlide .25s ease-out;}
@keyframes aniaSlide{from{opacity:0;transform:translateY(12px);}}

.ania-head{
  display:flex;align-items:center;gap:10px;padding:11px 14px;
  background:linear-gradient(90deg, rgba(45,224,138,.15), transparent);
  border-bottom:1px solid rgba(45,224,138,.2);
  cursor:move;user-select:none;
}
.ania-head b{font-size:13px;letter-spacing:.2em;color:#39ff9b;font-weight:600;}
.ania-head .sub{font-size:10px;color:#79a88f;margin-left:auto;}
.ania-head button{background:none;border:0;color:#79a88f;cursor:pointer;padding:3px;width:24px;height:24px;border-radius:5px;display:grid;place-items:center;}
.ania-head button:hover{background:rgba(255,255,255,.1);color:#39ff9b;}
.ania-head button svg{width:14px;height:14px;}

.ania-chat{
  flex:1;overflow-y:auto;padding:12px 14px;
  scrollbar-width:thin;scrollbar-color:rgba(45,224,138,.4) transparent;
}
.ania-chat::-webkit-scrollbar{width:5px;}
.ania-chat::-webkit-scrollbar-thumb{background:rgba(45,224,138,.3);border-radius:3px;}

.ania-msg{
  margin-bottom:10px;padding:9px 12px;border-radius:11px;
  font-size:13px;line-height:1.5;max-width:88%;
  word-wrap:break-word;white-space:pre-wrap;
  animation:aniaMsgIn .25s ease-out;
}
@keyframes aniaMsgIn{from{opacity:0;transform:translateY(6px);}}
.ania-msg.user{background:rgba(255,181,71,.14);color:#ffdca6;margin-left:auto;border:1px solid rgba(255,181,71,.25);}
.ania-msg.ania{background:rgba(45,224,138,.09);color:#d7f7e6;border:1px solid rgba(45,224,138,.22);}
.ania-msg.tool{background:rgba(95,201,255,.08);color:#b3e5ff;font-size:11px;border:1px dashed rgba(95,201,255,.3);font-family:monospace;}
.ania-msg.error{background:rgba(255,84,112,.1);color:#ffb8c6;border:1px solid rgba(255,84,112,.3);}

.ania-hint{font-size:10px;color:#4d6b5a;text-align:center;padding:6px;font-style:italic;}

.ania-input-wrap{
  display:flex;gap:8px;padding:11px 12px;
  border-top:1px solid rgba(45,224,138,.18);
  background:rgba(2,6,4,.7);
}
#ania-input{
  flex:1;background:rgba(8,18,14,.8);
  border:1px solid rgba(45,224,138,.25);
  color:#cfeede;border-radius:8px;
  padding:9px 12px;font-size:13px;outline:none;
  font-family:inherit;min-width:0;
}
#ania-input:focus{border-color:#39ff9b;box-shadow:0 0 0 2px rgba(57,255,155,.15);}
.ania-btn{
  width:38px;height:38px;border-radius:8px;
  border:1px solid rgba(45,224,138,.3);background:rgba(45,224,138,.06);
  color:#39ff9b;cursor:pointer;display:grid;place-items:center;
  transition:all .2s;flex:0 0 auto;
}
.ania-btn:hover{background:rgba(45,224,138,.18);border-color:#39ff9b;}
.ania-btn.mic.live{background:rgba(255,84,112,.15);border-color:#ff5470;color:#ff5470;animation:aniaMicPulse 1s infinite;}
@keyframes aniaMicPulse{50%{box-shadow:0 0 0 8px rgba(255,84,112,.15);}}
.ania-btn svg{width:16px;height:16px;fill:currentColor;}

.ania-toast{
  position:absolute;top:60px;left:50%;transform:translateX(-50%);
  background:rgba(8,18,14,.95);color:#39ff9b;
  padding:6px 14px;border-radius:20px;font-size:11px;
  border:1px solid rgba(45,224,138,.35);
  opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;
}
.ania-toast.on{opacity:1;}

/* Iconos genéricos */
.fa-app{
  display:inline-grid;place-items:center;border-radius:9px;color:#fff;

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════
   ANIA-OS · Núcleo unificado
   Secciones:
     1. Utilidades
     2. FS virtual (sistema de archivos del OS)
     3. Gestor de ventanas
     4. Aplicaciones del OS (explorer, word, excel, paint, calc, terminal, mines, notes, weather, media)
     5. Taskbar + Start menu
     6. Lock / boot / shutdown
     7. OSBridge · API que Ania usa para controlar el OS
     8. Ania: chat + voz + cerebro + comandos
     9. Autónomo: reglas programadas
    10. Arranque
═══════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════
   1. UTILIDADES
═══════════════════════════════════════════════════════════ */
const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

const Store = {
  get(k, d){ try{ const v = JSON.parse(localStorage.getItem('aniaos_'+k)); return v === null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('aniaos_'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('aniaos_'+k); }catch(e){} }
};

const Prefs = Store.get('prefs', {
  dark: false, accent: '#0a84d8', user: 'Operador', wall: 0
});
function savePrefs(){ Store.set('prefs', Prefs); }

/* ═══════════════════════════════════════════════════════════
   2. FS VIRTUAL
═══════════════════════════════════════════════════════════ */
let FS = null;

function seedFS(){
  FS = {
    'Documentos':{ type:'folder', children:{
      'Bienvenida.txt':{ type:'file', kind:'text', name:'Bienvenida.txt', size:380,
        text:'Bienvenido a ANIA-OS.\n\nEscribe o habla con Ania (esquina inferior derecha).\nPrueba:\n  · "abre word"\n  · "crea archivo notas.txt con hola mundo"\n  · "busca archivo bienvenida"\n  · "cambia el fondo a aurora"\n\nTodo lo que hagas aquí Ania lo puede hacer por ti.'
      }
    }},
    'Imágenes':{ type:'folder', children:{} },
    'Música':{ type:'folder', children:{} },
    'Apps':{ type:'folder', children:{} },
    'Descargas':{ type:'folder', children:{} },
    'Papelera':{ type:'folder', isTrash:true, children:{} }
  };
}

function getNode(path){
  let n = { children: FS };
  for(const p of path){
    if(!n.children || !n.children[p]) return null;
    n = n.children[p];
  }
  return n;
}
function ensureFolder(path){
  if(!FS) seedFS();
  let cur = { children: FS };
  for(const p of path){
    if(!cur.children) cur.children = {};
    if(!cur.children[p]) cur.children[p] = { type:'folder', children:{} };
    cur = cur.children[p];
    if(cur.type === 'file') return null;
  }
  if(!cur.children) cur.children = {};
  return cur;
}
function addFile(folderPath, node){
  const f = ensureFolder(folderPath);
  if(!f) return null;
  const nm = String(node.name || 'archivo');
  const dot = nm.lastIndexOf('.');
  const base = dot > 0 ? nm.slice(0, dot) : nm;
  const ext = dot > 0 ? nm.slice(dot) : '';
  let name = nm, i = 2;
  while(f.children[name]){ name = base + ' (' + i + ')' + ext; i++; }
  node.name = name;
  f.children[name] = node;
  return name;
}
function deleteNode(path){
  const parent = getNode(path.slice(0, -1));
  const name = path[path.length - 1];
  if(!parent || !parent.children || !parent.children[name]) return;
  const node = parent.children[name];
  if(parent.isTrash){ delete parent.children[name]; return; }
  const trash = ensureFolder(['Papelera']);
  let tn = node.name, i = 2;
  while(trash.children[tn]){ tn = node.name + ' (' + i + ')'; i++; }
  node.name = tn;
  trash.children[tn] = node;
  delete parent.children[name];
}

/* ═══════════════════════════════════════════════════════════
   3. GESTOR DE VENTANAS
═══════════════════════════════════════════════════════════ */
let zTop = 100, winSeq = 0, activeWin = null;
const openWins = new Map();

function focusWin(id){
  const w = openWins.get(id);
  if(!w) return;
  w.el.style.zIndex = ++zTop;
  openWins.forEach(o => o.el.classList.toggle('active', o === w));
  document.querySelectorAll('.task-btn').forEach(b => b.classList.toggle('active', b.dataset.win === id));
  activeWin = id;
}

function createWindow(opts){
  const id = 'w' + (++winSeq);
  const w = Math.min(opts.w || 760, innerWidth - 30);
  const h = Math.min(opts.h || 500, innerHeight - 70);
  const cnt = openWins.size;
  const x = Math.max(8, (innerWidth - w) / 2 + ((cnt % 7) - 3) * 30);
  const y = Math.max(4, (innerHeight - 44 - h) / 2 + ((cnt % 7) - 3) * 22);

  const win = el('div', 'window active');
  win.style.cssText = `width:${w}px;height:${h}px;left:${x}px;top:${y}px;z-index:${++zTop}`;
  win.innerHTML = `
    <div class="titlebar">
      <div class="tb-ico">${opts.icon || ''}</div>
      <div class="tb-title">${esc(opts.title || 'Ventana')}</div>
      <div class="tb-btns">
        <button class="tb-btn bmin" title="Minimizar">—</button>
        <button class="tb-btn bmax" title="Maximizar">▢</button>
        <button class="tb-btn close" title="Cerrar">✕</button>
      </div>
    </div>
    <div class="win-body"></div>
    <div class="rz"></div>`;
  $('#win-layer').appendChild(win);

  const rec = { el:win, body:win.querySelector('.win-body'), title:opts.title };
  openWins.set(id, rec);

  const tb = el('button', 'task-btn active', (opts.icon || '') + '<span class="tline"></span>');
  tb.dataset.win = id;
  tb.title = opts.title;
  tb.onclick = () => {
    if(activeWin === id && !win.classList.contains('minimized')) minimizeWin(id);
    else { win.classList.remove('minimized'); focusWin(id); }
  };
  $('#tb-tasks').appendChild(tb);

  win.querySelector('.bmin').onclick = e => { e.stopPropagation(); minimizeWin(id); };
  win.querySelector('.bmax').onclick = e => { e.stopPropagation(); toggleMax(id); };
  win.querySelector('.close').onclick = e => { e.stopPropagation(); closeWin(id); };
  win.addEventListener('pointerdown', () => focusWin(id));

  // Drag
  const tbar = win.querySelector('.titlebar');
  tbar.addEventListener('dblclick', e => { if(!e.target.closest('.tb-btn')) toggleMax(id); });
  tbar.addEventListener('pointerdown', e => {
    if(e.button !== 0 || e.target.closest('.tb-btn')) return;
    const sx = e.clientX, sy = e.clientY;
    let moved = false, ox = 0, oy = 0;
    function mm(ev){
      if(!moved){
        if(Math.hypot(ev.clientX - sx, ev.clientY - sy) < 4) return;
        moved = true;
        if(win.classList.contains('maximized')){
          win.classList.remove('maximized');
          win.style.width = w + 'px'; win.style.height = h + 'px';
          win.style.left = Math.max(0, ev.clientX - w / 2) + 'px';
          win.style.top = Math.max(0, ev.clientY - 16) + 'px';
        }
        ox = win.offsetLeft; oy = win.offsetTop;
      }
      win.style.left = (ox + ev.clientX - sx) + 'px';
      win.style.top = Math.max(0, oy + ev.clientY - sy) + 'px';
    }
    function mu(){
      document.removeEventListener('pointermove', mm);
    }
    document.addEventListener('pointermove', mm);
    document.addEventListener('pointerup', mu, { once:true });
  });

  // Resize
  const rz = win.querySelector('.rz');
  rz.addEventListener('pointerdown', e => {
    e.stopPropagation();
    const sx = e.clientX, sy = e.clientY;
    const ow = win.offsetWidth, oh = win.offsetHeight;
    function mm(ev){
      win.style.width = Math.max(320, ow + ev.clientX - sx) + 'px';
      win.style.height = Math.max(220, oh + ev.clientY - sy) + 'px';
    }
    document.addEventListener('pointermove', mm);
    document.addEventListener('pointerup', () => document.removeEventListener('pointermove', mm), { once:true });
  });

  focusWin(id);
  return {
    win, body: rec.body, id,
    setTitle(t){ rec.title = t; win.querySelector('.tb-title').textContent = t; tb.title = t; },
    close(){ closeWin(id); }
  };
}
function minimizeWin(id){
  const w = openWins.get(id);
  if(!w) return;
  w.el.classList.add('minimized');
  w.el.classList.remove('active');
  const tb = document.querySelector(`.task-btn[data-win="${id}"]`);
  if(tb) tb.classList.remove('active');
  if(activeWin === id) activeWin = null;
}
function toggleMax(id){
  const w = openWins.get(id);
  if(!w) return;
  w.el.classList.toggle('maximized');
}
function closeWin(id){
  const w = openWins.get(id);
  if(!w) return;
  w.el.classList.add('closing');
  setTimeout(() => { w.el.remove(); }, 160);
  openWins.delete(id);
  const tb = document.querySelector(`.task-btn[data-win="${id}"]`);
  if(tb) tb.remove();
  if(activeWin === id) activeWin = null;
}

/* ═══════════════════════════════════════════════════════════
   4. APLICACIONES DEL OS
═══════════════════════════════════════════════════════════ */
const SVG_FOLDER = '<svg width="42" height="42" viewBox="0 0 48 48"><path d="M4 10h13l4 5h20v6H4z" fill="#e8a200"/><path d="M4 16h37v22a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" fill="#ffc933"/></svg>';
const SVG_TXT    = '<svg width="42" height="42" viewBox="0 0 48 48"><path d="M11 4h20l6 6v34H11z" fill="#fff" stroke="#9aa5b1" stroke-width="1.4"/><path d="M31 4l6 6h-6z" fill="#dfe5ec" stroke="#9aa5b1" stroke-width="1.2"/><path d="M16 17h16M16 22h16M16 27h16M16 32h10" stroke="#5a9bd8" stroke-width="2"/></svg>';
const SVG_DOC    = '<svg width="42" height="42" viewBox="0 0 48 48"><path d="M11 4h20l6 6v34H11z" fill="#fff" stroke="#9aa5b1" stroke-width="1.4"/><rect x="6" y="17" width="24" height="24" rx="2" fill="#2B579A"/><text x="18" y="35" font-family="Segoe UI" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">W</text></svg>';
const SVG_XLS    = '<svg width="42" height="42" viewBox="0 0 48 48"><path d="M11 4h20l6 6v34H11z" fill="#fff" stroke="#9aa5b1" stroke-width="1.4"/><rect x="6" y="17" width="24" height="24" rx="2" fill="#217346"/><text x="18" y="35" font-family="Segoe UI" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">X</text></svg>';
const SVG_IMG    = '<svg width="42" height="42" viewBox="0 0 48 48"><rect x="5" y="9" width="38" height="30" rx="2.5" fill="#fff" stroke="#8f9aa6" stroke-width="1.4"/><path d="M8 34l10-12 7 8 5-5 10 9z" fill="#2f9e63"/><circle cx="33" cy="17" r="3.6" fill="#ffb900"/></svg>';
const SVG_AUDIO  = '<svg width="42" height="42" viewBox="0 0 48 48"><rect x="4" y="4" width="40" height="40" rx="4" fill="#C30052"/><circle cx="19" cy="32" r="4.6" fill="#fff"/><rect x="22" y="12" width="3.4" height="20" fill="#fff"/><path d="M22 12c5 1 8 3.5 8.6 8.4-2.6-2.4-5.4-3.2-8.6-3z" fill="#fff"/></svg>';
const SVG_HTML   = '<svg width="42" height="42" viewBox="0 0 48 48"><rect x="6" y="6" width="36" height="36" rx="4" fill="#1954A0"/><path d="M14 20h20M14 26h20M14 32h12" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>';
const SVG_APP    = '<svg width="42" height="42" viewBox="0 0 48 48"><rect x="6" y="6" width="36" height="36" rx="6" fill="#4a4f57"/></svg>';

function fileIcon(node){
  if(!node) return '';
  if(node.type !== 'file') return SVG_FOLDER;
  switch(node.kind){
    case 'doc':   return SVG_DOC;
    case 'sheet': return SVG_XLS;
    case 'image': return SVG_IMG;
    case 'audio': return SVG_AUDIO;
    case 'text':  return SVG_TXT;
    case 'html':  return SVG_HTML;
    default:      return SVG_APP;
  }
}

/* ── Explorador de archivos ── */
function appExplorer(startPath){
  const ctx = createWindow({ title:'Explorador', icon:SVG_FOLDER, w:880, h:560 });
  let cur = (startPath || ['Documentos']).slice();
  let sel = null;
  ctx.body.innerHTML = `
    <div class="ex-toolbar">
      <button class="ex-nav nback">◀</button>
      <button class="ex-nav nup">▲</button>
      <div class="ex-crumb"></div>
      <button class="ex-btn breload">⟳ Actualizar</button>
    </div>
    <div class="ex-main">
      <div class="ex-side"></div>
      <div class="ex-grid"></div>
    </div>
    <div class="ex-status"><span class="s1"></span><span class="s2"></span></div>`;
  const grid = ctx.body.querySelector('.ex-grid');
  const crumb = ctx.body.querySelector('.ex-crumb');
  const side = ctx.body.querySelector('.ex-side');

  function buildSide(){
    const quick = [
      ['Documentos','📄'], ['Imágenes','🖼'], ['Música','🎵'], ['Apps','⚙'], ['Descargas','⬇'], ['Papelera','🗑']
    ];
    side.innerHTML = quick.map(([n, i]) =>
      `<button data-p="${n}"><span style="width:20px;display:inline-block">${i}</span>${n}</button>`
    ).join('');
    side.querySelectorAll('button').forEach(b => {
      b.onclick = () => { cur = [b.dataset.p]; sel = null; render(); };
    });
  }
  buildSide();

  function render(){
    const node = getNode(cur);
    if(!node){ cur = ['Documentos']; return render(); }
    crumb.innerHTML = '';
    const root = el('b', '', 'ANIA-OS');
    root.style.cursor = 'pointer';
    root.onclick = () => { cur = []; render(); };
    crumb.appendChild(root);
    cur.forEach((p, i) => {
      crumb.appendChild(el('span', '', ' › '));
      const b = el('b', '', esc(p));
      b.style.cursor = 'pointer';
      b.onclick = () => { cur = cur.slice(0, i+1); render(); };
      crumb.appendChild(b);
    });

    grid.innerHTML = '';
    const entries = Object.keys(node.children || {}).map(k => node.children[k]);
    entries.sort((a, b) => {
      if(a.type !== b.type) return a.type === 'folder' ? -1 : 1;
      return a.name.localeCompare(b.name, 'es');
    });
    entries.forEach(n => {
      const it = el('div', 'ex-item',
        `<div class="ic">${fileIcon(n)}</div><span>${esc(n.name)}</span>`);
      it.onclick = () => {
        grid.querySelectorAll('.ex-item').forEach(x => x.classList.remove('sel'));
        it.classList.add('sel');
        sel = n;
      };
      it.ondblclick = () => {
        if(n.type === 'folder'){ cur = cur.concat([n.name]); sel = null; render(); }
        else openNode(n, cur.concat([n.name]));
      };
      it.oncontextmenu = e => {
        e.preventDefault(); it.click();
        const items = [{ label:'Abrir', action:() => it.ondblclick() }];
        if(!node.isTrash){
          items.push({ label:'Eliminar', action:() => { deleteNode(cur.concat([n.name])); render(); refreshDesktop(); } });
        }
        showCtxMenu(e.clientX, e.clientY, items);
      };
      grid.appendChild(it);
    });
    ctx.body.querySelector('.s1').textContent = entries.length + ' elemento(s)';
    ctx.body.querySelector('.s2').textContent = cur.join(' \\ ');
    ctx.setTitle((cur[cur.length - 1] || 'ANIA-OS') + ' · Explorador');
  }

  ctx.body.querySelector('.nback').onclick = () => { if(cur.length) { cur = cur.slice(0, -1); render(); } };
  ctx.body.querySelector('.nup').onclick = () => { cur = []; render(); };
  ctx.body.querySelector('.breload').onclick = render;
  render();
}

/* ── Bloc de notas ── */
function appNotepad(node){
  const ctx = createWindow({ title:(node?.name || 'Sin título') + ' · Notas', icon:SVG_TXT, w:640, h:480 });
  ctx.body.innerHTML = `<textarea class="np-area" spellcheck="false" placeholder="Escribe algo…">${esc(node?.text || '')}</textarea>
    <div class="np-status"><span class="np-n"></span><span>Guardado local</span></div>`;
  const ta = ctx.body.querySelector('.np-area');
  function upd(){ ctx.body.querySelector('.np-n').textContent = ta.value.length + ' caracteres'; }
  ta.addEventListener('input', upd);
  ta.addEventListener('keydown', e => {
    if(e.ctrlKey && e.key === 's'){
      e.preventDefault();
      if(!node){
        const name = prompt('Nombre del archivo:', 'nota-' + Date.now() + '.txt');
        if(!name) return;
        const real = addFile(['Documentos'], { type:'file', kind:'text', name, text:ta.value, size:ta.value.length });
        ctx.setTitle(real + ' · Notas');
        refreshDesktop();
      } else {
        node.text = ta.value;
        node.size = ta.value.length;
      }
    }
  });
  upd();
}

/* ── Word (editor con contenteditable) ── */
function appWord(node){
  const ctx = createWindow({ title:(node?.name || 'Documento') + ' · Word', icon:SVG_DOC, w:900, h:660 });
  ctx.body.innerHTML = `
    <div class="wp-toolbar">
      <button class="wp-btn" data-cmd="bold"><b>B</b></button>
      <button class="wp-btn" data-cmd="italic"><i>I</i></button>
      <button class="wp-btn" data-cmd="underline"><u>U</u></button>
      <button class="wp-btn" data-cmd="insertUnorderedList">•</button>
      <button class="wp-btn" data-cmd="justifyLeft">⬅</button>
      <button class="wp-btn" data-cmd="justifyCenter">⬌</button>
      <button class="wp-btn" data-cmd="justifyRight">➡</button>
      <span style="flex:1"></span>
      <button class="ex-btn w-save">💾 Guardar</button>
    </div>
    <div class="wp-canvas"><div class="page" contenteditable="true" spellcheck="false">${node?.html || '<p>Empieza a escribir…</p>'}</div></div>`;
  const page = ctx.body.querySelector('.page');
  ctx.body.querySelectorAll('[data-cmd]').forEach(b => {
    b.onmousedown = e => e.preventDefault();
    b.onclick = () => { page.focus(); document.execCommand(b.dataset.cmd); };
  });
  ctx.body.querySelector('.w-save').onclick = () => {
    if(!node){
      const name = prompt('Guardar como:', 'documento-' + Date.now() + '.html');
      if(!name) return;
      addFile(['Documentos'], { type:'file', kind:'doc', name, html:page.innerHTML, size:page.innerHTML.length });
      ctx.setTitle(name + ' · Word');
    } else {
      node.html = page.innerHTML;

/* ── Calculadora ── */
function appCalc(){
  const ctx = createWindow({ title:'Calculadora', icon:SVG_APP, w:340, h:470 });
  ctx.body.innerHTML = '<div class="calc"><div class="disp">0</div><div class="grid"></div></div>';
  const disp = ctx.body.querySelector('.disp');
  let acc = null, op = null, cur = '0', fresh = true;
  const keys = ['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0',',','='];
  const grid = ctx.body.querySelector('.grid');
  keys.forEach(k => {
    const cls = ['+','−','×','÷'].includes(k) ? 'op' : (k === '=' ? 'eq' : '');
    const b = el('button', cls, k);
    b.dataset.k = k;
    grid.appendChild(b);
  });
  grid.onclick = e => {
    const k = e.target.dataset.k;
    if(!k) return;
    if(/[0-9]/.test(k)){ cur = fresh ? k : (cur === '0' ? k : cur + k); fresh = false; }
    else if(k === ','){ if(!cur.includes(',')) { cur += ','; fresh = false; } }
    else if(k === 'C'){ acc = null; op = null; cur = '0'; fresh = true; }
    else if(k === '⌫'){ cur = cur.length > 1 ? cur.slice(0, -1) : '0'; }
    else if(k === '±'){ cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur; }
    else if(k === '%'){ cur = String(parseFloat(cur.replace(',', '.')) / 100).replace('.', ','); }
    else if(['+','−','×','÷'].includes(k)){ acc = parseFloat(cur.replace(',', '.')); op = k; fresh = true; }
    else if(k === '=' && op !== null){
      const b = parseFloat(cur.replace(',', '.'));
      let r = op === '+' ? acc + b : op === '−' ? acc - b : op === '×' ? acc * b : (b === 0 ? NaN : acc / b);
      cur = isFinite(r) ? String(+r.toFixed(10)).replace('.', ',') : 'Error';
      acc = null; op = null; fresh = true;
    }
    disp.textContent = cur;
  };
}

/* ── Buscaminas ── */
function appMines(){
  const ctx = createWindow({ title:'Buscaminas', icon:SVG_APP, w:360, h:470 });
  const R = 9, C = 9, M = 10;
  let mines, open, flag, dead, won, started;
  ctx.body.innerHTML = `
    <div style="padding:10px">
      <div style="display:flex;justify-content:space-between;padding:6px;background:var(--chrome);border-radius:4px;margin-bottom:8px;font-family:monospace;font-size:20px;color:#c00">
        <span id="m-mines">010</span><button id="m-reset" style="border:0;background:var(--chrome2);font-size:18px;cursor:pointer;padding:0 8px">🙂</button><span id="m-time">000</span>
      </div>
      <div id="m-grid" style="display:grid;grid-template-columns:repeat(9,30px);grid-auto-rows:30px;border:3px inset #9a9a9a;background:#bdbdbd"></div>
    </div>`;
  const grid = ctx.body.querySelector('#m-grid');
  let timer = null;
  function reset(){
    mines = new Set(); open = new Set(); flag = new Set();
    dead = false; won = false; started = false;
    if(timer){ clearInterval(timer); timer = null; }
    ctx.body.querySelector('#m-mines').textContent = '010';
    ctx.body.querySelector('#m-time').textContent = '000';
    render();
  }
  function neighbors(i){ const r = Math.floor(i / C), c = i % C, out = []; for(let dr = -1; dr <= 1; dr++) for(let dc = -1; dc <= 1; dc++){ if(!dr && !dc) continue; const nr = r + dr, nc = c + dc; if(nr >= 0 && nr < R && nc >= 0 && nc < C) out.push(nr * C + nc); } return out; }
  function countAdj(i){ return neighbors(i).filter(n => mines.has(n)).length; }
  function placeMines(safe){
    const forb = new Set([safe].concat(neighbors(safe)));
    while(mines.size < M){ const i = Math.floor(Math.random() * R * C); if(!forb.has(i)) mines.add(i); }
  }
  function reveal(i){
    if(open.has(i) || flag.has(i)) return;
    open.add(i);
    if(mines.has(i)){ dead = true; if(timer) clearInterval(timer); render(); return; }
    if(countAdj(i) === 0) neighbors(i).forEach(reveal);
    if(open.size === R * C - M){ won = true; if(timer) clearInterval(timer); mines.forEach(m => flag.add(m)); }
    render();
  }
  function render(){
    grid.innerHTML = '';
    for(let i = 0; i < R * C; i++){
      const d = document.createElement('div');
      d.style.cssText = 'display:grid;place-items:center;font-weight:700;font-size:14px;background:#c0c0c0;border:2px outset #e2e2e2;cursor:pointer;color:#111';
      if(open.has(i)){
        d.style.cssText = 'display:grid;place-items:center;font-weight:700;font-size:14px;border:1px solid #a9a9a9;background:#d9d9d9';
        if(mines.has(i)){ d.style.background = '#e81123'; d.textContent = '💣'; }
        else{ const n = countAdj(i); if(n){ d.textContent = n; d.style.color = ['','#1414d2','#0a7a0a','#d21414','#0d0d84','#7a0d0d','#0a7a7a','#000','#666'][n]; } }
      } else if(flag.has(i)){ d.textContent = '🚩'; }
      d.onclick = () => {
        if(dead || won || flag.has(i)) return;
        if(!started){ started = true; placeMines(i); let t = 0; timer = setInterval(() => { t++; ctx.body.querySelector('#m-time').textContent = String(Math.min(999, t)).padStart(3, '0'); }, 1000); }
        reveal(i);
      };
      d.oncontextmenu = e => { e.preventDefault(); if(dead || won || open.has(i)) return; flag.has(i) ? flag.delete(i) : flag.add(i); render(); };
      grid.appendChild(d);
    }
  }
  ctx.body.querySelector('#m-reset').onclick = reset;
  reset();
}

function openNode(node, path){
  if(!node) return;
  if(node.type !== 'file'){ APPS.explorer.launch({ path }); return; }
  switch(node.kind){
    case 'doc':   APPS.word.launch({ node }); break;
    case 'text':  APPS.notepad.launch({ node }); break;
    case 'image': APPS.photos.launch(); break;
    default:      alert('No sé abrir: ' + node.name);
  }
}

function tickClock(){
  const d = new Date();
  const t = d.toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });
  const f = d.toLocaleDateString('es-ES', { day:'2-digit', month:'2-digit', year:'numeric' });
  if($('#clk-t')) $('#clk-t').textContent = t;
  if($('#clk-d')) $('#clk-d').textContent = f;
  if($('#lock-t')) $('#lock-t').textContent = t;
  if($('#lock-d')) $('#lock-d').textContent = d.toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' });
}
setInterval(tickClock, 1000);

let lockStage = 0;
function lockScreen(){ lockStage = 1; $('#login').classList.remove('on'); $('#lock').classList.add('on'); }
function showLogin(){ lockStage = 2; $('#login').classList.add('on'); }
function unlock(){
  $('#lock').classList.remove('on');
  lockStage = 0;
  // Arrancar panel Ania tras desbloquear
  setTimeout(() => { if(window.AniaOS) AniaOS.abrir(); }, 1200);
}
$('#lock').addEventListener('click', e => { if(lockStage === 1 && e.target.id !== 'lock-power') showLogin(); });
document.addEventListener('keydown', e => {
  if(lockStage === 1) showLogin();
  else if(lockStage === 2 && e.key === 'Enter') unlock();
});
$('#login-btn').onclick = unlock;
$('#lock-power').onclick = e => { e.stopPropagation(); powerOff(); };

function powerOff(){
  $('#shutdown').classList.add('on');
  $('#sd-msg').textContent = 'Apagando…';
  $('#sd-spin').style.display = '';
  $('#power-on').style.display = 'none';
  setTimeout(() => {
    $('#sd-spin').style.display = 'none';
    $('#sd-msg').textContent = 'El equipo se ha apagado';
    $('#power-on').style.display = '';
  }, 1900);
}
$('#power-on').onclick = () => {
  $('#shutdown').classList.remove('on');
  $('#boot').style.display = 'flex';
  setTimeout(() => { $('#boot').style.display = 'none'; lockScreen(); }, 1700);
};

/* ═══════════════════════════════════════════════════════════
   7. OSBRIDGE · API para que Ania controle el OS
═══════════════════════════════════════════════════════════ */
const OSBridge = {
  /* ---- Apps ---- */
  listarApps(){ return Object.keys(APPS).map(k => ({ id:k, nombre:APPS[k].name, abierta:[...openWins.values()].some(w => w.title && w.title.toLowerCase().includes(APPS[k].name.toLowerCase())) })); },
  abrirApp(id){ const a = APPS[id]; if(!a) return { ok:false, error:'app desconocida: ' + id }; try{ a.launch(); return { ok:true, app:id }; }catch(e){ return { ok:false, error:e.message }; } },
  cerrarApp(id, titulo){
    let n = 0;
    openWins.forEach((w, wid) => {
      const match = titulo ? (w.title && w.title.toLowerCase().includes(String(titulo).toLowerCase())) : (!id || w.title.toLowerCase().includes((APPS[id]?.name || id).toLowerCase()));
      if(match){ closeWin(wid); n++; }
    });
    return { ok:true, cerrados:n };
  },
  ventanasAbiertas(){ return [...openWins.values()].map(w => ({ titulo:w.title })); },

  /* ---- Archivos ---- */
  listarArchivos(carpeta){
    const node = getNode(carpeta ? [carpeta] : []);
    if(!node) return { ok:false, error:'no existe' };
    return { ok:true, carpeta:carpeta || '(raíz)', items: Object.keys(node.children || {}).map(k => { const c = node.children[k]; return { nombre:c.name, tipo:c.type, kind:c.kind || null, tamaño:c.size || 0 }; }) };
  },
  crearArchivo(carpeta, nombre, contenido, tipo){
    const path = [carpeta || 'Documentos'];
    if(!getNode(path)) return { ok:false, error:'carpeta no existe' };
    const kind = tipo || inferirKind(nombre);
    const real = addFile(path, { type:'file', kind, name:nombre, text:contenido || '', size:(contenido || '').length });
    refreshDesktop();
    return { ok:true, archivo:real, carpeta:path[0], kind };
  },
  leerArchivo(carpeta, nombre){
    const node = getNode([carpeta || 'Documentos', nombre]);
    if(!node) return { ok:false, error:'no existe' };
    return { ok:true, contenido: node.text || node.html || '(binario)', tamaño: node.size || 0 };
  },
  borrarArchivo(carpeta, nombre){
    if(!getNode([carpeta || 'Documentos', nombre])) return { ok:false, error:'no existe' };
    deleteNode([carpeta || 'Documentos', nombre]);
    refreshDesktop();
    return { ok:true };
  },
  buscarArchivos(q){
    const ql = String(q || '').toLowerCase().trim();
    if(!ql) return { ok:false, error:'falta término' };
    const hits = [];
    (function walk(node, path){
      if(!node || !node.children) return;
      for(const k of Object.keys(node.children)){
        const c = node.children[k];
        const np = path.concat([c.name]);
        if(c.type === 'file' && c.name.toLowerCase().includes(ql)) hits.push({ ruta:np.join('/'), tamaño:c.size || 0 });
        if(c.type !== 'file') walk(c, np);
      }
    })(getNode([]), []);
    return { ok:true, resultados: hits.slice(0, 30) };
  },

  /* ---- Sistema ---- */
  cambiarFondo(id){
    Prefs.wall = Number(id) || 0;
    savePrefs();
    applyWall();
    return { ok:true, fondo:Prefs.wall };
  },
  infoSistema(){
    const hm = performance.memory;
    let n = 0;
    (function walk(node){ if(!node?.children) return; for(const k of Object.keys(node.children)){ n++; if(node.children[k].type !== 'file') walk(node.children[k]); } })(FS);
    return { ok:true, ventanas:openWins.size, apps:Object.keys(APPS).length, archivos:n, memoriaJS: hm ? Math.round(hm.usedJSHeapSize / 1048576) + ' MB' : '—', nucleos:navigator.hardwareConcurrency || '—', online:navigator.onLine };
  },
  apagar(){ powerOff(); return { ok:true }; },
  bloquear(){ lockScreen(); return { ok:true }; },

  /* ---- NLU (comandos en lenguaje natural) ---- */
  async ejecutar(cmd){
    const c = String(cmd || '').toLowerCase().trim();
    if(!c) return { ok:false, error:'comando vacío' };
    let m;

    // abrir app
    m = c.match(/^(?:abre|abrir|lanza|inicia|ejecuta|arranca)\s+(?:la\s+|el\s+|los\s+|las\s+)?(.+?)$/);
    if(m){
      const q = m[1].trim();
      const aliases = {
        'explorador':'explorer','archivos':'explorer','documentos':'explorer','papelera':'explorer',
        'word':'word','documento':'word','texto':'notepad','bloc':'notepad','notas':'notes','notepad':'notepad',
        'excel':'excel','hoja':'excel','calculo':'excel',
        'paint':'paint','dibujo':'paint','dibujar':'paint',
        'calc':'calc','calculadora':'calc','cuenta':'calc',
        'terminal':'terminal','consola':'terminal','cmd':'terminal','shell':'terminal',
        'buscaminas':'mines','minas':'mines','mines':'mines',
        'clima':'weather','tiempo':'weather','meteorologia':'weather',
        'musica':'media','reproductor':'media','cancion':'media','audio':'media',
        'fotos':'photos','imagenes':'photos','galeria':'photos'
      };
      const found = aliases[q] || Object.keys(APPS).find(k => k === q || APPS[k].name.toLowerCase().includes(q));
      if(found) return this.abrirApp(found);
      return { ok:false, error:'app no reconocida: ' + q };
    }

    // cerrar
    m = c.match(/^cierra\s+(?:la\s+|el\s+|las\s+|los\s+)?(?:ventana\s+de\s+|app\s+)?(.+)$/);
    if(m){
      const q = m[1].trim();
      if(/todas|ventanas/.test(q)) return this.cerrarApp();
      return this.cerrarApp(null, q);
    }

    // crear archivo
    m = c.match(/^(?:crea|crear|crea\s+un|nuevo|guarda|escribe)\s+(?:un\s+|el\s+|la\s+)?(?:archivo|documento|nota|doc)\s+(?:llamado\s+|con\s+nombre\s+|de\s+nombre\s+)?["']?([^"']+?)["']?(?:\s+con\s+(?:contenido|texto)\s+["']?(.+?)["']?)?$/);
    if(m){
      return this.crearArchivo('Documentos', m[1].trim(), (m[2] || '').trim());
    }

    // buscar archivos
    m = c.match(/^(?:busca|b[uú]scame|encuentra|buscar)\s+(?:el\s+archivo\s+|el\s+documento\s+|archivo\s+|los\s+archivos\s+de\s+)?(.+)$/);
    if(m){
      const q = m[1].trim();
      if(/en\s+internet|en\s+la\s+web|en\s+wikipedia|en\s+google/.test(q)) return { ok:false, error:'buscar en web → usa chat' };
      return this.buscarArchivos(q);
    }

    // cambiar fondo
    m = c.match(/^(?:cambia|cambiar|pon)\s+(?:el\s+)?fondo\s+(?:a\s+|por\s+|al?\s+)?(.+)$/);
    if(m){
      const map = { 'aurora':0, '0':0, 'ventana':1, '1':1, 'montaña':2, 'montanas':2, '2':2, 'lineas':3, 'líneas':3, '3':3 };
      const k = map[m[1].trim()];
      if(k != null) return this.cambiarFondo(k);
      return { ok:false, error:'fondo no reconocido' };
    }

    // apagar / bloquear
    if(/^(?:apaga|apagar|shutdown)\s*(?:el\s+)?(?:pc|sistema|equipo|os)?$/.test(c)) return this.apagar();
    if(/^(?:bloquea|bloquear|lock)\s*(?:la\s+)?(?:pantalla|sesi[oó]n|pc)?$/.test(c)) return this.bloquear();

    // información
    if(/^(?:info|estado|status)\s*(?:del\s+)?(?:sistema|os)?$/.test(c)) return this.infoSistema();
    if(/ventanas?\s+abiertas?/.test(c)) return { ok:true, ventanas:this.ventanasAbiertas() };
    if(/^qu[eé]\s+apps/.test(c)) return { ok:true, apps:this.listarApps() };

    // listar archivos
    m = c.match(/^(?:lista|listar|muestra|qu[eé]\s+hay\s+en|archivos\s+de)\s+(?:los\s+|las\s+)?(?:archivos\s+de\s+|carpeta\s+)?(.+)$/);
    if(m) return this.listarArchivos(m[1].trim());

    return { ok:false, error:'comando no reconocido. Prueba: "abre word", "crea archivo nota.txt con hola", "cambia el fondo a aurora", "busca archivo bienvenida"' };
  }
};
window.OSBridge = OSBridge;

function inferirKind(nombre){
  const e = String(nombre).split('.').pop().toLowerCase();
  if(['txt','md','log','csv'].includes(e)) return 'text';
  if(['doc','docx'].includes(e)) return 'doc';
  if(['xls','xlsx'].includes(e)) return 'sheet';
  if(['png','jpg','jpeg','gif','webp','svg'].includes(e)) return 'image';
  if(['mp3','wav','ogg','m4a','flac'].includes(e)) return 'audio';
  if(['html','htm'].includes(e)) return 'html';
  return 'generic';
}

/* ---------- Audio motor (para música procedural y beeps) ---------- */
let _AC = null;
function ensureAudio(){ if(!_AC){ try{ _AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} } if(_AC && _AC.state === 'suspended') _AC.resume(); }
function beep(freq, dur, delay = 0){
  if(!_AC) return;
  const o = _AC.createOscillator(), g = _AC.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, _AC.currentTime + delay);
  g.gain.exponentialRampToValueAtTime(0.18, _AC.currentTime + delay + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, _AC.currentTime + delay + dur);
  o.connect(g); g.connect(_AC.destination);
  o.start(_AC.currentTime + delay); o.stop(_AC.currentTime + delay + dur + 0.05);
}

/* ---------- Música procedural (expuesta a window para appMedia) ---------- */
const AniaMusic = {
  on:false, master:null, timer:null, beat:0, BPM:72,
  CHORDS:[[60,64,67,71,36],[57,60,64,67,33],[53,57,60,64,29],[55,59,62,65,31]],
  f(m){ return 440 * Math.pow(2, (m - 69) / 12); },
  start(){
    ensureAudio(); this.stop();
    if(!_AC) return;
    this.on = true; this.beat = 0;
    this.master = _AC.createGain();
    this.master.gain.value = 0.0001;
    this.master.connect(_AC.destination);
    this.master.gain.exponentialRampToValueAtTime(0.35, _AC.currentTime + 2);
    const tick = () => {
      if(!this.on) return;
      const b = this.beat;
      const ch = this.CHORDS[Math.floor(b / 8) % this.CHORDS.length];
      if(b % 8 === 0){ ch.slice(0, 4).forEach(m => this.pad(m)); this.bass(ch[4]); }
      if(b % 4 === 0) this.kick();
      if(b % 4 === 2) this.hat();
      this.beat++;
      this.timer = setTimeout(tick, (60 / this.BPM) * 1000);
    };
    tick();
  },
  pad(m){
    const o = _AC.createOscillator(), g = _AC.createGain(), f = _AC.createBiquadFilter();
    o.type = 'triangle'; o.frequency.value = this.f(m);
    f.type = 'lowpass'; f.frequency.value = 1400;
    const dur = (60 / this.BPM) * 8;
    g.gain.setValueAtTime(0.0001, _AC.currentTime);
    g.gain.linearRampToValueAtTime(0.04, _AC.currentTime + 0.8);
    g.gain.linearRampToValueAtTime(0.0001, _AC.currentTime + dur);
    o.connect(f); f.connect(g); g.connect(this.master);
    o.start(); o.stop(_AC.currentTime + dur + 0.1);
  },
  bass(m){
    const o = _AC.createOscillator(), g = _AC.createGain();
    o.type = 'sine'; o.frequency.value = this.f(m);
    const dur = (60 / this.BPM) * 7;
    g.gain.setValueAtTime(0.0001, _AC.currentTime);
    g.gain.linearRampToValueAtTime(0.12, _AC.currentTime + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, _AC.currentTime + dur);
    o.connect(g); g.connect(this.master);
    o.start(); o.stop(_AC.currentTime + dur + 0.1);
  },
  kick(){
    const o = _AC.createOscillator(), g = _AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, _AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(45, _AC.currentTime + 0.12);
    g.gain.setValueAtTime(0.4, _AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, _AC.currentTime + 0.16);
    o.connect(g); g.connect(this.master);
    o.start(); o.stop(_AC.currentTime + 0.2);
  },
  hat(){
    const len = _AC.sampleRate * 0.05;
    const buf = _AC.createBuffer(1, len, _AC.sampleRate);
    const d = buf.getChannelData(0);
    for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = _AC.createBufferSource(); s.buffer = buf;
    const f = _AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
    const g = _AC.createGain(); g.gain.value = 0.06;
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start();
  },
  stop(){ this.on = false; clearTimeout(this.timer); if(this.master){ try{ this.master.gain.exponentialRampToValueAtTime(0.0001, _AC.currentTime + 0.8); }catch(e){} const m = this.master; setTimeout(() => m.disconnect(), 1000); } this.master = null; }
};
window.AniaMusic = AniaMusic;

const AniaAmbient = {
  mode:null, master:null, src:null, timer:null, filt:null,
  start(mode){
    ensureAudio(); this.stop();
    if(!_AC) return;
    this.mode = mode;
    this.master = _AC.createGain();
    this.master.gain.value = 0.0001;
    this.master.connect(_AC.destination);
    this.master.gain.exponentialRampToValueAtTime(0.35, _AC.currentTime + 2);
    const len = _AC.sampleRate * 4;
    const buf = _AC.createBuffer(1, len, _AC.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for(let i = 0; i < len; i++){ const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
    this.src = _AC.createBufferSource();
    this.src.buffer = buf; this.src.loop = true;
    this.filt = _AC.createBiquadFilter();
    this.filt.type = 'lowpass';
    this.filt.frequency.value = mode === 'lluvia' ? 800 : 420;
    this.src.connect(this.filt); this.filt.connect(this.master);
    this.src.start();
    if(mode === 'lluvia') this.timer = setInterval(() => { if(Math.random() < 0.8) this.plip(900 + Math.random() * 1600, 0.04); }, 220);
  },
  plip(freq, dur){
    if(!_AC || !this.master) return;
    const o = _AC.createOscillator(), g = _AC.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, _AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.09, _AC.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, _AC.currentTime + dur);
    o.connect(g); g.connect(this.master);
    o.start(); o.stop(_AC.currentTime + dur + 0.05);
  },
  stop(){ if(this.master){ try{ this.master.gain.exponentialRampToValueAtTime(0.0001, _AC.currentTime + 0.8); }catch(e){} const m = this.master; setTimeout(() => m.disconnect(), 1000); } if(this.src){ try{ this.src.stop(); }catch(e){} } clearInterval(this.timer); this.master = this.src = this.filt = null; this.timer = null; this.mode = null; }
};
window.AniaAmbient = AniaAmbient;

/* ---------- Utilidades de chat ---------- */
const AniaState = {
  abierto: false,
  escuchando: false,
  esperando: false,
  historial: Store.get('historial', [])
};

function setStatusAnia(txt){ const s = $('#ania-status'); if(s) s.textContent = txt; }
function setToastAnia(txt){
  const t = $('#ania-toast');
  if(!t) return;
  t.textContent = txt;
  t.classList.add('on');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('on'), 1800);
}
function addMsg(tipo, texto){
  const chat = $('#ania-chat');
  const el = document.createElement('div');
  el.className = 'ania-msg ' + tipo;
  el.textContent = texto;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  // Persistir
  if(tipo === 'user' || tipo === 'ania'){
    AniaState.historial.push({ t:tipo, x:texto, ts:Date.now() });
    if(AniaState.historial.length > 200) AniaState.historial = AniaState.historial.slice(-200);
    Store.set('historial', AniaState.historial);
  }
  return el;
}

/* ---------- Voz (Web Speech API) ---------- */
let _recog = null;
function initRecog(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return null;
  const r = new SR();
  r.lang = 'es-ES';
  r.interimResults = false;
  r.continuous = false;
  r.maxAlternatives = 1;
  r.onresult = e => {
    const txt = e.results[0][0].transcript;
    $('#ania-input').value = '';
    AniaState.escuchando = false;
    actualizarUIvoz();
    procesarMensaje(txt);
  };
  r.onend = () => { AniaState.escuchando = false; actualizarUIvoz(); setStatusAnia('lista'); };
  r.onerror = e => { AniaState.escuchando = false; actualizarUIvoz(); setToastAnia('Error voz: ' + e.error); };
  return r;
}
function actualizarUIvoz(){
  const mic = $('#ania-mic');
  const fab = $('#ania-fab');
  mic?.classList.toggle('live', AniaState.escuchando);
  fab?.classList.toggle('escuchando', AniaState.escuchando);
}

function toggleVoz(){
  if(AniaState.escuchando){
    try{ _recog?.stop(); }catch(e){}
    AniaState.escuchando = false;
    actualizarUIvoz();
    return;
  }
  if(!_recog) _recog = initRecog();
  if(!_recog){ setToastAnia('Voz no soportada en este navegador'); return; }
  try{ _recog.start(); AniaState.escuchando = true; actualizarUIvoz(); setToastAnia('🎙 Escuchando…'); setStatusAnia('escuchando'); }catch(e){ setToastAnia('Error: ' + e.message); }
}

/* ---------- TTS ---------- */
function hablar(texto){
  if(!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  const u = new SpeechSynthesisUtterance(String(texto).slice(0, 280));
  u.lang = 'es-ES';
  u.rate = 1.05; u.pitch = 1.1;
  try{
    const vs = speechSynthesis.getVoices().filter(v => /^es/i.test(v.lang));
    if(vs.length) u.voice = vs.find(v => /google espa|sabina|monica|helena|laura/i.test(v.name)) || vs[0];
  }catch(e){}
  speechSynthesis.speak(u);
}
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};

/* ---------- Cerebro local (reglas + comandos) ---------- */
function normalizar(t){
  return String(t || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[¿?¡!.,;:"'`´()\[\]]/g, ' ').replace(/\s+/g, ' ').trim();
}
function contiene(t, ...palabras){ return palabras.some(p => t.includes(p)); }

async function cerebroLocal(raw, low){
  // ⭐ 1) Probar OSBridge primero (para comandos del OS)
  const r = await OSBridge.ejecutar(raw);
  if(r.ok){
    let msg = '✓ ';
    if(r.app) msg += 'App ' + r.app + ' abierta.';
    else if(r.archivo) msg += 'Archivo «' + r.archivo + '» creado en ' + r.carpeta + '.';
    else if(r.cerrados != null) msg += r.cerrados + ' ventana(s) cerrada(s).';
    else if(r.items) msg += (r.carpeta) + ': ' + r.items.slice(0, 8).map(i => i.nombre).join(', ') + (r.items.length > 8 ? ' …' : '');
    else if(r.resultados) msg += r.resultados.length ? r.resultados.length + ' encontrado(s):\n' + r.resultados.map(x => '· ' + x.ruta).join('\n') : 'Sin resultados.';
    else if(r.ventanas) msg += r.ventanas.length + ' ventana(s) abierta(s): ' + r.ventanas.map(v => v.titulo).join(', ');
    else if(r.apps) msg += r.apps.length + ' apps disponibles.';
    else if(r.memoriaJS) msg += `Ventanas: ${r.ventanas}, Apps: ${r.apps}, Archivos: ${r.archivos}, Memoria: ${r.memoriaJS}, Núcleos: ${r.nucleos}, Online: ${r.online ? 'sí' : 'no'}`;
    else if(r.fondo != null) msg += 'Fondo cambiado a ' + r.fondo + '.';
    else msg += 'Hecho.';
    return msg;
  }

  // ⭐ 2) Conversación (identidad, emociones, etc.)
  if(contiene(low, 'hola', 'hey', 'buenas', 'que tal', 'que bola')) return pick([
    'Hola. Soy Ania. ¿En qué te ayudo hoy?',
    'Aquí estoy. Café virtual servido. ¿Qué necesitas?',
    'Hola. Di «abre word» o pregúntame lo que sea.'
  ]);
  if(contiene(low, 'quien eres', 'que eres', 'como te llamas', 'presentate')) return 'Soy Ania: cerebro local + control del OS. Puedo abrir apps, crear archivos, buscar, y charlar contigo. Todo en tu dispositivo.';
  if(contiene(low, 'que puedes hacer', 'ayuda', 'comandos', 'help')) return 'Cosas que puedo hacer:\n· "abre word", "abre excel", "abre terminal"\n· "crea archivo notas.txt con hola mundo"\n· "busca archivo bienvenida"\n· "cambia el fondo a aurora"\n· "cierra ventanas"\n· "info sistema"\n· "apaga" o "bloquea"\n· "pon música", "pon lluvia", "para la música"\n· Conversación normal.';
  if(contiene(low, 'gracias')) return pick(['De nada.', 'Un placer.', 'Para eso estoy.']);
  if(contiene(low, 'adios', 'chao', 'hasta luego', 'nos vemos')) return 'Hasta pronto.';
  if(contiene(low, 'te quiero', 'te amo')) return '*sonríe* Lo mismo digo. Eres parte de mi núcleo.';

  // ⭐ 3) Música / ambiente
  if(contiene(low, 'pon musica', 'ponme musica', 'musica')){ AniaMusic.start(); return 'Lo-fi procedural sonando.'; }
  if(contiene(low, 'pon lluvia', 'ponme lluvia', 'lluvia')){ AniaAmbient.start('lluvia'); return 'Lluvia generada.'; }
  if(contiene(low, 'para la musica', 'deten la musica', 'silencio')){ AniaMusic.stop(); AniaAmbient.stop(); return 'Detenido.'; }

  // ⭐ 4) Hora / fecha
  if(contiene(low, 'que hora', 'hora es')){
    const d = new Date();
    return 'Son las ' + d.toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' }) + ' del ' + d.toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' }) + '.';
  }

  // ⭐ 5) Empatía básica
  if(contiene(low, 'estoy triste', 'me siento mal', 'estoy deprimido')) return 'Lo siento. Estoy aquí. ¿Quieres contarme o prefieres que te distraiga con algo?';
  if(contiene(low, 'estoy estresado', 'estoy ansioso', 'nervioso')) return 'Respira. Cinco minutos, café y respiración lenta. ¿Qué te aprieta?';
  if(contiene(low, 'estoy feliz', 'estoy contento')) return '¡Me alegro! Cuéntame qué pasó.';

  // ⭐ 6) Fallback
  return pick([
    'No tengo una respuesta exacta para eso sin internet, pero puedo charlar o ejecutar comandos del OS. ¿Probamos "abre word" o me cuentas más?',
    'Aún no domino ese tema. Dame más contexto o pídeme algo del OS: apps, archivos, música, fondo…',
    'Mi lado conversacional es limitado offline. Mis comandos: "abre X", "crea archivo", "busca", "cambia fondo". ¿Algo así?'
  ]);
}

/* ---------- Procesar mensaje: cascada OSBridge → cerebro local ---------- */
async function procesarMensaje(texto){
  if(!texto || AniaState.esperando) return;
  AniaState.esperando = true;
  addMsg('user', texto);
  setStatusAnia('pensando…');
  $('#ania-fab')?.classList.add('pensando');

  const low = normalizar(texto);
  const resp = await cerebroLocal(texto, low);

  addMsg('ania', resp);
  setStatusAnia('lista');
  $('#ania-fab')?.classList.remove('pensando');

  // Speak (sin await para no bloquear)
  hablar(resp);

  AniaState.esperando = false;
}

/* ---------- Drag del panel ---------- */
function enableDragPanel(){
  const panel = $('#ania-panel');
  const handle = $('#ania-head');
  let sx, sy, ox, oy, dragging = false;
  handle.addEventListener('pointerdown', e => {
    if(e.target.closest('button')) return;
    dragging = true;
    sx = e.clientX; sy = e.clientY;
    const r = panel.getBoundingClientRect();
    ox = r.left; oy = r.top;
    panel.style.right = 'auto'; panel.style.bottom = 'auto';
    panel.style.left = ox + 'px'; panel.style.top = oy + 'px';
    document.body.style.cursor = 'grabbing';
    e.preventDefault();
  });
  document.addEventListener('pointermove', e => {
    if(!dragging) return;
    const nx = clamp(ox + e.clientX - sx, 0, window.innerWidth - 100);
    const ny = clamp(oy + e.clientY - sy, 0, window.innerHeight - 60);
    panel.style.left = nx + 'px';
    panel.style.top = ny + 'px';
  });
  document.addEventListener('pointerup', () => {
    if(!dragging) return;
    dragging = false;
    document.body.style.cursor = '';
  });
}

/* ---------- API pública del panel ---------- */
const AniaOS = {
  abrir(){ AniaState.abierto = true; $('#ania-panel').classList.add('abierto'); $('#ania-input')?.focus(); },
  cerrar(){ AniaState.abierto = false; $('#ania-panel').classList.remove('abierto'); },
  toggle(){ AniaState.abierto ? this.cerrar() : this.abrir(); },
  enviar(txt){ procesarMensaje(txt); },
  hablar(){ toggleVoz(); }
};
window.AniaOS = AniaOS;

/* ---------- Inicializar panel ---------- */
function initPanelAnia(){
  $('#ania-fab').onclick = () => AniaOS.toggle();
  $('#ania-close').onclick = () => AniaOS.cerrar();
  $('#ania-clear').onclick = () => {
    $('#ania-chat').innerHTML = '';
    AniaState.historial = [];
    Store.set('historial', []);
    addMsg('ania', 'Chat limpio.');
  };
  $('#ania-form').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('#ania-input').value.trim();
    if(!v) return;
    $('#ania-input').value = '';
    procesarMensaje(v);
  });
  $('#ania-mic').onclick = toggleVoz;
  enableDragPanel();

  // Restaurar historial
  if(AniaState.historial.length){
    AniaState.historial.slice(-20).forEach(m => addMsg(m.t, m.x));
  } else {
    addMsg('ania', 'Hola. Soy Ania. Pulsa el micrófono o escribe:\n· "abre word"\n· "crea archivo notas.txt con hola mundo"\n· "cambia el fondo a aurora"\n· Ctrl+Space abre/cierra el panel.');
  }

  // Atajos
  document.addEventListener('keydown', e => {
    if(e.ctrlKey && e.code === 'Space'){ e.preventDefault(); AniaOS.toggle(); }
    if(e.key === 'Escape' && AniaState.abierto) AniaOS.cerrar();
  });

  // Auto-abrir tras primer arranque
  if(!Store.get('welcomeShown', false)){
    Store.set('welcomeShown', true);
    setTimeout(() => AniaOS.abrir(), 3000);
  }
}

/* ═══════════════════════════════════════════════════════════
   9. AUTÓNOMO · reglas programadas
═══════════════════════════════════════════════════════════ */
const Autonomo = {
  activo: Store.get('autonomoActivo', true),
  ciclo: null,
  ultimoTick: 0,
  historial: Store.get('autonomoHist', []),
  reglas: [
    { id:'cafe-manana', desc:'Aviso de café a las 10',
      cuando: s => s.hora === 10 && s.min === 0,
      accion: () => { if(window.AniaOS) AniaOS.enviar('¿Ya tomaste café? Es la hora perfecta.'); } },
    { id:'cierre-dia', desc:'Resumen antes de dormir',
      cuando: s => s.hora === 22 && s.min === 30,
      accion: () => { if(window.AniaOS) AniaOS.enviar('Cierre del día. Descansa bien.'); } },
    { id:'limpieza-3am', desc:'Cierra ventanas a las 3 AM',
      cuando: s => s.hora === 3 && s.min === 0,
      accion: () => { OSBridge.cerrarApp(); } },
    { id:'bateria-baja', desc:'Aviso batería baja',
      cuando: () => false, accion: () => {} }
  ],
  estados: Store.get('autonomoEstados', {}),
  evaluar(){
    if(!this.activo) return;
    const d = new Date();
    const s = { hora:d.getHours(), min:d.getMinutes() };
    const ahora = Date.now();
    this.reglas.forEach(r => {
      const last = this.estados[r.id] || 0;
      if(ahora - last < 60 * 1000) return; // min 1 min entre ejecuciones
      try{
        if(r.cuando(s)){
          this.estados[r.id] = ahora;
          Store.set('autonomoEstados', this.estados);
          r.accion();
          this.historial.unshift({ id:r.id, t:ahora, desc:r.desc });
          if(this.historial.length > 30) this.historial.length = 30;
          Store.set('autonomoHist', this.historial);
        }
      }catch(e){ console.warn('Autónomo:', r.id, e.message); }
    });
  },
  init(){
    if(this.ciclo) clearInterval(this.ciclo);
    this.ciclo = setInterval(() => this.evaluar(), 30 * 1000);
    console.log('🌙 Autónomo iniciado ·', this.reglas.length, 'reglas · activo:', this.activo);
  }
};

/* ═══════════════════════════════════════════════════════════
   10. ARRANQUE
═══════════════════════════════════════════════════════════ */
function applyAccent(){
  document.documentElement.style.setProperty('--accent', Prefs.accent);
  document.documentElement.style.setProperty('--accent2', Prefs.accent + 'cc');
}
function applyTheme(){ document.body.classList.toggle('dark', !!Prefs.dark); }
function applyWall(){
  const walls = [
    'linear-gradient(135deg,#04070d,#0a2038 50%,#0d2b4a)',
    'linear-gradient(135deg,#1c4a77,#0d2440 60%,#04070d)',
    'linear-gradient(135deg,#0e1e38,#3e5a80 50%,#8a5a4a)',
    'linear-gradient(135deg,#0a0f1a,#0d2440 50%,#0f1a2e)'
  ];
  const w = walls[Prefs.wall] || walls[0];
  $('#wallpaper').style.background = w;
  $('#lock').style.background = w;
}
function applyUser(){
  const u = Prefs.user || 'Operador';
  if($('#login-name')) $('#login-name').textContent = u;
  if($('#login-av')) $('#login-av').textContent = u.charAt(0).toUpperCase();
  const smu = $('.sm-user');
  if(smu){ smu.textContent = u.charAt(0).toUpperCase(); smu.title = u; }
}

async function boot(){
  // Config inicial
  applyTheme(); applyAccent(); applyWall(); applyUser();
  // FS
  seedFS();
  // Montar UI
  $('#desktop').classList.add('on');
  buildTaskbar();
  buildStartMenu();
  renderDesktop();
  tickClock();
  // Esperar boot
  await new Promise(r => setTimeout(r, 1700));
  $('#boot').style.display = 'none';
  lockScreen();
  // Iniciar servicios tras lock
  const check = setInterval(() => {
    if(lockStage === 0){
      clearInterval(check);
      initPanelAnia();
      Autonomo.init();
      console.log('✓ ANIA-OS operativo ·', Object.keys(APPS).length, 'apps ·', openWins.size, 'ventanas');
    }
  }, 500);
}

boot();

// Exponer para debugging
window.__aniaOS = { APPS, OSBridge, FS, openWins, AniaOS, AniaMusic, AniaAmbient, Autonomo };
</script>
